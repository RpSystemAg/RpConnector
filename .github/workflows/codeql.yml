name: CodeQL

# A weekly scan tells you about a vulnerability up to seven days after it was
# merged, which is after the code it describes has already shipped. Running on
# the pull request moves the finding to the moment someone can still act on it
# cheaply, and running on master keeps the default-branch baseline current --
# without that baseline GitHub cannot tell "this PR introduces an alert" from
# "this alert already existed", so every PR would report the same backlog.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python', 'actions']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3.37.7 line
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3.37.7 line
        with:
          category: '/language:${{ matrix.language }}'
