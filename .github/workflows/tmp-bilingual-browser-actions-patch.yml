name: Apply bilingual browser action search patch

on:
  push:
    branches:
      - chatgpt/bilingual-browser-action-search-20260820
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chatgpt/bilingual-browser-action-search-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/bilingual-browser-action-search-20260820
          persist-credentials: true
          fetch-depth: 0
      - name: Apply bounded bilingual patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor: {label} ({text.count(old)})')
              return text.replace(old, new, 1)

          lex_path = Path('prstudio-unified-control/includes/class-prstudio-uc-action-lexicon.php')
          lex = lex_path.read_text(encoding='utf-8')
          lex = replace_once(lex, "\t\t'check inspect status list'      => 'controlla controllare controllo ispeziona ispezionare',", "\t\t'check inspect status list'      => 'controlla controllare controllo ispeziona ispezionare spunta spuntare',", 'check/spunta concept')
          lex = replace_once(lex, "\t\t'screenshot'                     => 'schermata schermate istantanea',", "\t\t'screenshot'                     => 'schermata schermate istantanea cattura catturare',", 'screenshot/cattura concept')
          lex = replace_once(lex, "\t\t'wait'                           => 'aspetta aspettare attendi attendere',\n\t\t'crop'                           => 'ritaglia ritagliare ritaglio',", "\t\t'wait'                           => 'aspetta aspettare attendi attendere',\n\t\t'reload refresh'                 => 'ricarica ricaricare',\n\t\t'back previous'                  => 'indietro precedente precedenti',\n\t\t'forward next'                   => 'avanti successivo successiva successivi successive',\n\t\t'hover'                          => 'sorvola sorvolare',\n\t\t'focus'                          => 'focalizza focalizzare',\n\t\t'fill'                           => 'compila compilare riempi riempire',\n\t\t'select choose'                  => 'seleziona selezionare scegli scegliere',\n\t\t'extract'                        => 'estrai estrarre',\n\t\t'adopt'                          => 'adotta adottare',\n\t\t'crop'                           => 'ritaglia ritagliare ritaglio',", 'browser action concepts')
          lex = replace_once(lex, "\t\t'settings options'               => 'impostazione impostazioni configurazione configurazioni preferenze option',", "\t\t'settings options'               => 'impostazione impostazioni configurazione configurazioni preferenze option opzione opzioni',", 'option concept')
          lex = replace_once(lex, "\t\t'field fields input inputs'      => 'campo campi input',\n\t\t'button buttons'                 => 'pulsante pulsanti bottone bottoni',", "\t\t'field fields input inputs'      => 'campo campi input',\n\t\t'checkbox checkboxes'            => 'casella caselle checkbox',\n\t\t'button buttons'                 => 'pulsante pulsanti bottone bottoni',", 'checkbox concept')
          lex = replace_once(lex, "\tprivate const PHRASES = array(\n\t\t'banca dati'              => 'database',", "\tprivate const PHRASES = array(\n\t\t'screen shot'             => 'screenshot',\n\t\t'passa sopra'             => 'hover',\n\t\t'metti a fuoco'           => 'focus',\n\t\t'torna indietro'          => 'back previous',\n\t\t'go back'                 => 'back previous',\n\t\t'scrivi nel campo'        => 'fill',\n\t\t'write in the field'      => 'fill',\n\t\t'banca dati'              => 'database',", 'browser phrases')
          lex_path.write_text(lex, encoding='utf-8')

          mcp_path = Path('prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php')
          mcp = mcp_path.read_text(encoding='utf-8')
          start = mcp.index('    private static function browser_actions_search(array $args): array {')
          end = mcp.index('    private static function flow_value($value,array $vars){', start)
          new_method = r'''    private static function browser_actions_search(array $args): array {
        $raw=strtolower(trim((string)($args['query']??'')));
        // Puppeteer is a technical compatibility spelling, not a natural-language
        // translation. Keep that alias local; every human-language equivalence
        // below belongs to the shared Action Lexicon.
        $q=str_replace('puppeteer','playwright',$raw);
        $limit=max(1,min(50,(int)($args['limit']??20)));$scored=array();$seen=array();
        if(!class_exists('PRSTUDIO_UC_Action_Lexicon')){
            $lexicon_path=defined('PRSTUDIO_UC_DIR')?rtrim((string)PRSTUDIO_UC_DIR,"/\\").'/includes/class-prstudio-uc-action-lexicon.php':__DIR__.'/class-prstudio-uc-action-lexicon.php';
            if(is_readable($lexicon_path))require_once $lexicon_path;
        }
        $lexicon_ready=class_exists('PRSTUDIO_UC_Action_Lexicon');
        $query_normalized=$lexicon_ready?PRSTUDIO_UC_Action_Lexicon::normalize_text($q):trim(str_replace(array('_','-'),' ',$q));
        $query_concepts=$lexicon_ready?PRSTUDIO_UC_Action_Lexicon::query_concepts($q):array();
        $query_keys=$lexicon_ready?PRSTUDIO_UC_Action_Lexicon::concept_keys($query_concepts):array();
        foreach(PRSTUDIO_UC_Contract::domain_actions('browser') as $meta){
            if('browser_agent'!==(string)($meta['executor']??''))continue;
            $action=self::canonical_browser_action((string)($meta['action']??''));
            if(isset($seen[$action]))continue;
            $desc=(string)($meta['description']??'');$tool=(string)($meta['tool_name']??'');$score=0;
            $typed_tool=self::typed_browser_tool_for_action($action);
            if(''===$raw){
                $score=1;
            }elseif($lexicon_ready){
                $action_normalized=PRSTUDIO_UC_Action_Lexicon::normalize_text($action);
                $tool_normalized=PRSTUDIO_UC_Action_Lexicon::normalize_text($tool);
                $typed_normalized=PRSTUDIO_UC_Action_Lexicon::normalize_text($typed_tool);
                if($query_normalized===$action_normalized||(''!==$tool_normalized&&$query_normalized===$tool_normalized)||(''!==$typed_normalized&&$query_normalized===$typed_normalized)){
                    $score=120;
                }elseif($query_concepts){
                    $manual=(array)(self::$manual[$typed_tool]??array());
                    $action_concepts=PRSTUDIO_UC_Action_Lexicon::query_concepts($action);
                    $description_concepts=PRSTUDIO_UC_Action_Lexicon::query_concepts($desc);
                    $tool_concepts=PRSTUDIO_UC_Action_Lexicon::query_concepts(trim($tool.' '.$typed_tool.' '.(string)($manual['title']??'').' '.(string)($manual['guidance']??'')));
                    $candidate_concepts=array_merge($action_concepts,$description_concepts,$tool_concepts);
                    $candidate_keys=PRSTUDIO_UC_Action_Lexicon::concept_keys($candidate_concepts);
                    if(PRSTUDIO_UC_Action_Lexicon::equivalent($action_concepts,$query_concepts)||PRSTUDIO_UC_Action_Lexicon::equivalent($tool_concepts,$query_concepts)){
                        $score=105;
                    }elseif(PRSTUDIO_UC_Action_Lexicon::covers($action_concepts,$query_concepts)||PRSTUDIO_UC_Action_Lexicon::covers($tool_concepts,$query_concepts)){
                        $score=90;
                    }elseif(PRSTUDIO_UC_Action_Lexicon::covers($description_concepts,$query_concepts)){
                        $score=70;
                    }elseif(PRSTUDIO_UC_Action_Lexicon::covers($candidate_concepts,$query_concepts)){
                        $score=60;
                    }else{
                        $overlap=count(array_intersect($query_keys,$candidate_keys));
                        if($overlap>0)$score=20+(int)round(35*$overlap/max(1,count($query_keys)));
                    }
                }
            }
            if($score<1)continue;
            if(''!==$typed_tool)$score+=5;
            $aliases=str_starts_with($action,'playwright_')?array('puppeteer_'.substr($action,11)):array();
            $item=array('action'=>$action,'aliases'=>$aliases,'description'=>$desc,'read_only'=>(bool)($meta['read_only']??false),'destructive'=>(bool)($meta['destructive']??false),'input_schema'=>$meta['input_schema']??array(),'executor'=>'browser_agent');
            if(''!==$typed_tool){$item['tier']='typed';$item['canonical_tool']=$typed_tool;}else{$item['tier']='advanced';}$item['generic_dispatch_supported']=true;
            $scored[]=array('score'=>$score,'item'=>$item);$seen[$action]=true;
        }
        // Preserve the Search Console fallback exactly: it is a technical
        // product/provider alias path and is intentionally independent from the
        // bilingual browser-action scorer above.
        foreach(array('search_console_sites','search_console_search_analytics','search_console_sitemaps','search_console_url_inspection','search_console_request_indexing') as $action){
            if(isset($seen[$action]))continue;$score=(''===$q||str_contains($action,$q)||str_contains($q,'google')||str_contains($q,'gsc')||str_contains($q,'search console'))?20:0;
            if($score)$scored[]=array('score'=>$score,'item'=>array('action'=>$action,'aliases'=>array(),'description'=>'Browser-first Google Search Console operation.','read_only'=>'search_console_request_indexing'!==$action,'destructive'=>false,'executor'=>'browser_agent'));
        }
        usort($scored,static fn($a,$b)=>$b['score']<=>$a['score'] ?: strcmp((string)$a['item']['action'],(string)$b['item']['action']));
        $items=array_map(static fn($row)=>$row['item'],array_slice($scored,0,$limit));
        return array('count'=>count($items),'items'=>$items,'query'=>$raw,'query_normalized'=>$query_normalized,'browser_first'=>true,'puppeteer_aliases_normalized_to_playwright'=>true,'generic_dispatch_roundtrip_required'=>false);
    }



'''
          mcp = mcp[:start] + new_method + mcp[end:]
          mcp = replace_once(mcp, "$tools[]=self::tool('browser_actions_search','Search advanced browser actions','Use this when the exact browser operation is not one of the typed tools. Searches only actions with a real Browser Agent executor.',self::obj(array('query'=>self::str('Browser intent/action keyword.'),'limit'=>self::integer('',1,50)),array('query')),self::annotations(true,false,true,true));", "$tools[]=self::tool('browser_actions_search','Search advanced browser actions','Use this when the exact browser operation is not one of the typed tools. Searches Italian and English intent through the shared action lexicon and returns only actions with a real Browser Agent executor.',self::obj(array('query'=>self::str('Browser intent/action keyword in Italian or English.'),'limit'=>self::integer('',1,50)),array('query')),self::annotations(true,false,true,true));", 'browser_actions_search tool description')
          mcp_path.write_text(mcp, encoding='utf-8')

          test_path = Path('tests/php-mcp-operator-bootstrap-smoke.php')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(test, "define('PRSTUDIO_UC_TESTING', true);\n", "define('PRSTUDIO_UC_TESTING', true);\ndefine('ABSPATH', dirname(__DIR__).'/');\ndefine('PRSTUDIO_UC_DIR', dirname(__DIR__).'/prstudio-unified-control/');\nif (!function_exists('trailingslashit')) { function trailingslashit($v){ return rtrim((string)$v, '/\\\\').'/'; } }\n", 'test constants')
          test = replace_once(test, "final class PRSTUDIO_UC_Execution_Lanes {\n    public static function open(array $args,array $context=[]){return ['ok'=>true,'lane_id'=>'lane_'.str_repeat('a',32),'lane_handle'=>'lane_'.str_repeat('a',32),'lane_token'=>'secret','mission_id'=>'mission:test','reused'=>false];}\n}\n\nrequire dirname(__DIR__).'/prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php';", "final class PRSTUDIO_UC_Execution_Lanes {\n    public static function open(array $args,array $context=[]){return ['ok'=>true,'lane_id'=>'lane_'.str_repeat('a',32),'lane_handle'=>'lane_'.str_repeat('a',32),'lane_token'=>'secret','mission_id'=>'mission:test','reused'=>false];}\n}\nif (!class_exists('PRSTUDIO_UC_Turn')) {\n    final class PRSTUDIO_UC_Turn {\n        public static function normalize($value,string $correlation_id='',string $tool='',int $attempt=1):array{return ['status'=>'completed','terminal'=>true,'attempt'=>$attempt,'result'=>$value];}\n        public static function is_terminal(string $status):bool{return true;}\n    }\n}\n\nrequire_once dirname(__DIR__).'/prstudio-unified-control/includes/class-prstudio-uc-action-lexicon.php';\nrequire_once dirname(__DIR__).'/prstudio-unified-control/includes/class-prstudio-uc-contract.php';\nrequire dirname(__DIR__).'/prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php';", 'test runtime dependencies')
          insertion = r'''

// browser_actions_search is a public MCP discovery surface, so bilingual parity
// is asserted through the real tools/call transport and the real browser action
// contract rather than by calling the matcher directly.
function browser_search_via_mcp(string $query): array {
    static $rpcId = 1000;
    $response = PRSTUDIO_UC_MCP_V5::handle(new WP_REST_Request('POST',[
        'jsonrpc'=>'2.0','id'=>++$rpcId,'method'=>'tools/call',
        'params'=>['name'=>'browser_actions_search','arguments'=>['query'=>$query,'limit'=>50]],
    ]));
    $payload = (array)$response->get_data();
    $structured = (array)($payload['result']['structuredContent']??[]);
    check(!empty($structured['ok']) && ($structured['status']??'')==='completed','browser_actions_search tools/call completes for '.$query);
    return (array)($structured['result']??[]);
}
function browser_action_names(array $result): array {
    return array_values(array_map(static fn(array $item):string=>(string)($item['action']??''),(array)($result['items']??[])));
}

$browserSearchPairs = [
    ['apri una scheda','open a tab'],
    ['compila il campo','fill the field'],
    ['riempi il campo','fill the field'],
    ['seleziona opzione','select option'],
    ['spunta casella','check checkbox'],
    ['estrai contenuto','extract content'],
    ['aspetta risposta','wait for response'],
    ['torna indietro','go back'],
    ['ricarica pagina','reload page'],
    ['cattura pagina','screenshot page'],
    ['clicca il pulsante e compila il campo','click the button and fill the field'],
];
foreach ($browserSearchPairs as [$italian,$english]) {
    $itResult=browser_search_via_mcp($italian);
    $enResult=browser_search_via_mcp($english);
    $itActions=browser_action_names($itResult);
    $enActions=browser_action_names($enResult);
    check($itActions!==[],'browser_actions_search finds real actions for '.$italian);
    check($itActions===$enActions,'browser_actions_search IT/EN ordered parity: '.$italian.' / '.$english);
}
$puppeteer=browser_action_names(browser_search_via_mcp('puppeteer_click'));
$playwright=browser_action_names(browser_search_via_mcp('playwright_click'));
check($puppeteer===$playwright && ($playwright[0]??'')==='playwright_click','browser_actions_search preserves exact Puppeteer compatibility alias');
$nonsense=browser_search_via_mcp('zzqv frobnicate');
check(($nonsense['count']??-1)===0 && browser_action_names($nonsense)===[],'browser_actions_search nonsense returns zero matches');
$gsc=browser_action_names(browser_search_via_mcp('gsc'));
check(in_array('search_console_sites',$gsc,true),'browser_actions_search preserves Search Console fallback');
'''
          test = replace_once(test, '\nfwrite(STDOUT,"OK MCP operator bootstrap smoke\\n");', insertion + '\nfwrite(STDOUT,"OK MCP operator bootstrap smoke\\n");', 'browser search regressions')
          test_path.write_text(test, encoding='utf-8')

          Path('.github/workflows/tmp-bilingual-browser-actions-patch.yml').unlink()
          PY
          git config user.name "PR STUDIO Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add prstudio-unified-control/includes/class-prstudio-uc-action-lexicon.php \
                  prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php \
                  tests/php-mcp-operator-bootstrap-smoke.php \
                  .github/workflows/tmp-bilingual-browser-actions-patch.yml
          git commit -m "Make browser action discovery bilingual by construction"
          git push origin HEAD:chatgpt/bilingual-browser-action-search-20260820
