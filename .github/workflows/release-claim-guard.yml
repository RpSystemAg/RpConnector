name: Release claim guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-claim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-claim:
    name: production_proven cannot exceed evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tests/release-evidence-gate.py --commit "$GITHUB_SHA"
