name: Release claim guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-claim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-claim:
    name: production_proven cannot exceed evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tests/release-evidence-gate.py --commit "$GITHUB_SHA"
