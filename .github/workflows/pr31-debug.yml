name: PR31 migration debug
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-browser-live-streaming-20260820
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/pr31-remove-browser-live.yml').read_text()
          a=src.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          b=src.index("\n          PY",a)
          env={'__name__':'__main__'}
          try:
              exec(compile(textwrap.dedent(src[a:b]),'pr31-inline','exec'),env)
          except SystemExit as e:
              print('STOP:',e)
              text=env.get('s','')
              for i,line in enumerate(text.splitlines(),1):
                  if 'browser_live_' in line or 'BROWSER_LIVE_URI' in line or 'PRSTUDIO_UC_Browser_Live' in line:
                      print(f'{i}: {line}')
              raise
          PY
