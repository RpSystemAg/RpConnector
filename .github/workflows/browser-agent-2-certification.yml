name: Browser Agent 2.0 certification

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: browser-agent-2-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-browser-agent-2:
    name: Official MCP bridge / MV3 / schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"browser-agent-2-certification","description":"Official Browser MCP bridge certification running","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Custom Browser engine is gone
        run: |
          set -euo pipefail
          test ! -e prstudio-unified-browser-agent/lib
          test ! -e prstudio-unified-browser-agent/page-runtime.js
          test ! -e prstudio-unified-browser-agent/page-runtime-main.js
          test ! -e prstudio-unified-browser-agent/tests
          ! grep -R -n -E 'chrome\.debugger|chrome\.scripting|sendCommand|executeScript' \
            prstudio-unified-browser-agent/service-worker.js \
            prstudio-unified-browser-agent/manifest.json

      - name: MV3 and source syntax
        run: |
          set -euo pipefail
          node --check prstudio-unified-browser-agent/service-worker.js
          node --check prstudio-unified-browser-agent/sidepanel.js
          node --check prstudio-browser-mcp-bridge/src/server.mjs
          php -l prstudio-unified-control/includes/class-prstudio-uc-browser-vendor-mcp.php
          php -l prstudio-unified-control/prstudio-unified-control.php
          jq -e '.manifest_version == 3 and .version == "1.1.0" and ((.permissions | index("debugger")) == null) and ((.permissions | index("scripting")) == null)' prstudio-unified-browser-agent/manifest.json

      - name: ChatGPT IT/EN browser surface contract
        run: |
          set -euo pipefail
          schema=prstudio-unified-control/contract/browser-vendor-mcp-tools.json
          jq -e '
            .checked_at == "2026-08-21" and
            .transport_action == "mcp_bridge_call" and
            (.tools | length) == 8 and
            ([.tools[].name] | unique | length) == 8 and
            ([.tools[] | select((.title_it | length) > 0 and (.title_en | length) > 0 and (.description_it | length) > 0 and (.description_en | length) > 0)] | length) == 8 and
            (.upstream.chrome_devtools_mcp.version == "1.7.0") and
            (.upstream.selenium.version == "4.47.0") and
            (.upstream.selenium.official_mcp_server == false)
          ' "$schema"
          jq -e '.actions[] | select(.action == "mcp_bridge_call" and .executor == "browser_agent")' prstudio-unified-control/contract/browser-action-overlay.json

      - name: Install pinned official dependencies
        working-directory: prstudio-browser-mcp-bridge
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          node -e "const p=require('./node_modules/chrome-devtools-mcp/package.json'); if(p.version!=='1.7.0') process.exit(1)"
          node -e "const p=require('./node_modules/selenium-webdriver/package.json'); if(p.version!=='4.47.0') process.exit(1)"
          npm ls @modelcontextprotocol/sdk chrome-devtools-mcp selenium-webdriver

      - name: Loopback bridge smoke test
        run: |
          set -euo pipefail
          node prstudio-browser-mcp-bridge/src/server.mjs > /tmp/prstudio-mcp-bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true; cat /tmp/prstudio-mcp-bridge.log' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/health > /tmp/health.json && break
            sleep 1
          done
          jq -e '.ok == true and .host == "127.0.0.1" and .chrome_mcp == "chrome-devtools-mcp@1.7.0" and .selenium == "selenium-webdriver@4.47.0" and (.providers | length) == 4' /tmp/health.json
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"provider":"selenium","operation":"tools/list"}' \
            http://127.0.0.1:8765/call > /tmp/selenium-tools.json
          jq -e '.ok == true and .provider == "selenium" and (.tools | length) >= 10' /tmp/selenium-tools.json
          if curl --silent --output /tmp/forbidden.json --write-out '%{http_code}' -H 'Origin: https://example.com' http://127.0.0.1:8765/health | grep -q '^200$'; then
            echo 'web origin unexpectedly allowed' >&2
            exit 1
          fi

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success; description='Official Browser MCP bridge certification passed' ;;
            cancelled) state=error; description='Official Browser MCP bridge certification cancelled' ;;
            *) state=failure; description='Official Browser MCP bridge certification failed' ;;
          esac
          jq -n \
            --arg state "$state" \
            --arg context 'browser-agent-2-certification' \
            --arg description "$description" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/browser-agent-status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/browser-agent-status.json
