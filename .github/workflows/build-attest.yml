name: Build and attest provenance

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify generated capability/contract artifacts match source
        run: python tests/regenerate-contract-artifacts.py --php-binary php --check

      - name: Verify BUILD-INFO.json counts match the generated registry/catalog/contract
        run: node .github/scripts/check-build-info-counts.mjs

      - name: Generate component MANIFEST/FILE-INTEGRITY (release pipeline order, deterministic)
        run: python tests/build-release.py --build

      - name: Package build artifacts
        run: |
          mkdir -p dist
          sha=$(git rev-parse --short HEAD)
          zip -rq "dist/prstudio-unified-browser-agent-${sha}.zip" prstudio-unified-browser-agent -x '*.claude*'
          zip -rq "dist/prstudio-unified-control-${sha}.zip" prstudio-unified-control

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.zip'

      - uses: actions/upload-artifact@v7
        with:
          name: prstudio-build-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
