name: Production WordPress lifecycle

on:
  pull_request:
  workflow_dispatch:
    inputs:
      previous_ref:
        description: Exact previous release commit/tag to upgrade from
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-wordpress-lifecycle-${{ github.sha }}
  cancel-in-progress: true

jobs:
  wordpress-lifecycle:
    name: Real upgrade, interrupted migration, backup and clean restore
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_MAIN: /tmp/rp-production-main
      WP_FAIL: /tmp/rp-production-failure
      WP_RESTORE: /tmp/rp-production-restore
      MARKERS: /tmp/rp-production-markers
      BASELINE: /tmp/rp-production-baseline.json
      POST_UPGRADE: /tmp/rp-production-post-upgrade.json
      POST_RESTORE: /tmp/rp-production-post-restore.json
      METRICS: /tmp/rp-production-lifecycle-metrics.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring, curl
          tools: wp-cli:2.12.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Resolve exact previous release ref
        env:
          INPUT_PREVIOUS_REF: ${{ inputs.previous_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          previous="$INPUT_PREVIOUS_REF"
          if [ -z "$previous" ]; then previous="$PR_BASE_SHA"; fi
          if [ -z "$previous" ]; then previous="$(git rev-parse HEAD^)"; fi
          git cat-file -e "${previous}^{commit}"
          previous_sha="$(git rev-parse "${previous}^{commit}")"
          test "$previous_sha" != "$GITHUB_SHA" || { echo 'previous release cannot equal candidate commit' >&2; exit 1; }
          echo "PREVIOUS_REF=$previous_sha" >> "$GITHUB_ENV"
          mkdir -p "$MARKERS"
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/rp-production-started-at
          echo "candidate=$GITHUB_SHA previous=$previous_sha"

      - name: Create isolated lifecycle databases
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -P3306 -uroot -e 'CREATE DATABASE rp_lifecycle_main CHARACTER SET utf8mb4; CREATE DATABASE rp_lifecycle_failure CHARACTER SET utf8mb4; CREATE DATABASE rp_lifecycle_restore CHARACTER SET utf8mb4;'

      - name: Install WordPress with previous release
        run: |
          set -euo pipefail
          rm -rf "$WP_MAIN" /tmp/rp-previous-tree
          mkdir -p "$WP_MAIN" /tmp/rp-previous-tree
          wp core download --path="$WP_MAIN" --force
          wp config create --path="$WP_MAIN" --dbname=rp_lifecycle_main --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_MAIN" --url=http://127.0.0.1:8091 --title='RP lifecycle main' --admin_user=rpadmin --admin_password='Production-Lifecycle-Only-2026!' --admin_email='lifecycle@example.invalid' --skip-email
          git archive "$PREVIOUS_REF" prstudio-unified-control | tar -x -C /tmp/rp-previous-tree
          cp -a /tmp/rp-previous-tree/prstudio-unified-control "$WP_MAIN/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$WP_MAIN"
          wp eval --path="$WP_MAIN" 'if (class_exists("PRSTUDIO_UC_Recovery_Manager")) { $r=PRSTUDIO_UC_Recovery_Manager::run_deferred_migration(); if (empty($r["ok"])) { fwrite(STDERR,wp_json_encode($r)."\n"); exit(1); } }'

      - name: Seed and fingerprint persistent previous-release state
        run: |
          set -euo pipefail
          RP_LIFECYCLE_ACTION=seed wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          RP_LIFECYCLE_ACTION=snapshot RP_LIFECYCLE_FILE="$BASELINE" wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          test -s "$BASELINE"

      - name: Replace previous plugin with exact candidate commit
        run: |
          set -euo pipefail
          rm -rf "$WP_MAIN/wp-content/plugins/prstudio-unified-control"
          cp -a prstudio-unified-control "$WP_MAIN/wp-content/plugins/prstudio-unified-control"
          wp eval --path="$WP_MAIN" '$r=PRSTUDIO_UC_Recovery_Manager::run_deferred_migration(); if (empty($r["ok"]) || ($r["state"]??"")!=="completed") { fwrite(STDERR,wp_json_encode($r)."\n"); exit(1); } echo wp_json_encode($r),"\n";'
          RP_LIFECYCLE_ACTION=assert-migration-completed wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          RP_LIFECYCLE_ACTION=assert-preserved RP_LIFECYCLE_FILE="$BASELINE" wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          RP_LIFECYCLE_ACTION=snapshot RP_LIFECYCLE_FILE="$POST_UPGRADE" wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          echo "previous=$PREVIOUS_REF candidate=$GITHUB_SHA independent state fingerprint preserved" > "$MARKERS/previous_release_upgrade"

      - name: Migration rerun is idempotent for persistent state
        run: |
          set -euo pipefail
          wp eval --path="$WP_MAIN" '$r=PRSTUDIO_UC_Recovery_Manager::run_deferred_migration(); if (empty($r["ok"])) { fwrite(STDERR,wp_json_encode($r)."\n"); exit(1); }'
          RP_LIFECYCLE_ACTION=assert-preserved RP_LIFECYCLE_FILE="$BASELINE" wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          count_device=$(wp db query --path="$WP_MAIN" --skip-column-names "SELECT COUNT(*) FROM wp_prstudio_uc_devices WHERE device_uuid=(SELECT option_value FROM wp_options WHERE option_name='rp_production_test_device_uuid')")
          count_job=$(wp db query --path="$WP_MAIN" --skip-column-names "SELECT COUNT(*) FROM wp_prstudio_uc_jobs WHERE job_uuid=(SELECT option_value FROM wp_options WHERE option_name='rp_production_test_job_uuid')")
          test "$count_device" = '1'
          test "$count_job" = '1'
          echo 'second migration pass preserved state and did not duplicate sentinels' > "$MARKERS/migration_idempotency"

      - name: Fresh install candidate in independent failure environment
        run: |
          set -euo pipefail
          rm -rf "$WP_FAIL"
          mkdir -p "$WP_FAIL"
          wp core download --path="$WP_FAIL" --force
          wp config create --path="$WP_FAIL" --dbname=rp_lifecycle_failure --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_FAIL" --url=http://127.0.0.1:8092 --title='RP lifecycle failure' --admin_user=rpadmin --admin_password='Production-Lifecycle-Only-2026!' --admin_email='failure@example.invalid' --skip-email
          cp -a prstudio-unified-control "$WP_FAIL/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$WP_FAIL"
          wp eval --path="$WP_FAIL" 'if (!PRSTUDIO_UC_Store::schema_ready()) { fwrite(STDERR,"schema not ready after fresh activation\n"); exit(1); }'
          echo 'fresh install activated exact candidate and schema is ready' > "$MARKERS/fresh_install"

      - name: Inject interrupted migration and prove fail-closed retry state
        run: |
          set -euo pipefail
          RP_LIFECYCLE_ACTION=prepare-migration-failure wp eval-file tests/wordpress-production-state.php --path="$WP_FAIL"
          wp eval --path="$WP_FAIL" '$r=PRSTUDIO_UC_Recovery_Manager::run_deferred_migration(); if (!empty($r["ok"]) || ($r["state"]??"")!=="retryable") { fwrite(STDERR,"expected retryable failure: ".wp_json_encode($r)."\n"); exit(1); } echo wp_json_encode($r),"\n";'
          RP_LIFECYCLE_ACTION=assert-migration-retryable wp eval-file tests/wordpress-production-state.php --path="$WP_FAIL"
          echo 'injected migration failure remained retryable and never completed' > "$MARKERS/failed_migration_not_marked_complete"

      - name: Remove fault and prove interrupted migration resumes
        run: |
          set -euo pipefail
          RP_LIFECYCLE_ACTION=cleanup-migration-failure wp eval-file tests/wordpress-production-state.php --path="$WP_FAIL"
          wp eval --path="$WP_FAIL" '$r=PRSTUDIO_UC_Recovery_Manager::run_deferred_migration(); if (empty($r["ok"]) || ($r["state"]??"")!=="completed") { fwrite(STDERR,wp_json_encode($r)."\n"); exit(1); } echo wp_json_encode($r),"\n";'
          RP_LIFECYCLE_ACTION=assert-migration-completed wp eval-file tests/wordpress-production-state.php --path="$WP_FAIL"
          echo 'same environment resumed from retryable failure to completed' > "$MARKERS/interrupted_migration_resume"

      - name: Create database and private-memory backup
        run: |
          set -euo pipefail
          backup_start=$(date +%s)
          wp db export /tmp/rp-production-backup.sql --path="$WP_MAIN"
          test -s /tmp/rp-production-backup.sql
          test -d "$WP_MAIN/wp-content/prstudio-unified-private"
          tar -C "$WP_MAIN/wp-content" -czf /tmp/rp-production-private.tgz prstudio-unified-private
          test -s /tmp/rp-production-private.tgz
          backup_end=$(date +%s)
          echo "$backup_start" > /tmp/rp-backup-start
          echo "$backup_end" > /tmp/rp-backup-end
          sha256sum /tmp/rp-production-backup.sql /tmp/rp-production-private.tgz > /tmp/rp-production-backup.sha256
          echo 'database and private memory backup created with sha256' > "$MARKERS/backup_created"

      - name: Prove destructive mutation changes the independent fingerprint
        run: |
          set -euo pipefail
          RP_LIFECYCLE_ACTION=mutate wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"
          if RP_LIFECYCLE_ACTION=assert-preserved RP_LIFECYCLE_FILE="$BASELINE" wp eval-file tests/wordpress-production-state.php --path="$WP_MAIN"; then
            echo 'mutation unexpectedly preserved baseline fingerprint' >&2
            exit 1
          fi

      - name: Restore into a clean WordPress filesystem and clean database
        run: |
          set -euo pipefail
          restore_start=$(date +%s)
          rm -rf "$WP_RESTORE"
          mkdir -p "$WP_RESTORE"
          wp core download --path="$WP_RESTORE" --force
          wp config create --path="$WP_RESTORE" --dbname=rp_lifecycle_restore --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          cp -a prstudio-unified-control "$WP_RESTORE/wp-content/plugins/prstudio-unified-control"
          wp db import /tmp/rp-production-backup.sql --path="$WP_RESTORE"
          rm -rf "$WP_RESTORE/wp-content/prstudio-unified-private"
          tar -C "$WP_RESTORE/wp-content" -xzf /tmp/rp-production-private.tgz
          RP_LIFECYCLE_ACTION=assert-preserved RP_LIFECYCLE_FILE="$BASELINE" wp eval-file tests/wordpress-production-state.php --path="$WP_RESTORE"
          RP_LIFECYCLE_ACTION=assert-migration-completed wp eval-file tests/wordpress-production-state.php --path="$WP_RESTORE"
          RP_LIFECYCLE_ACTION=snapshot RP_LIFECYCLE_FILE="$POST_RESTORE" wp eval-file tests/wordpress-production-state.php --path="$WP_RESTORE"
          restore_end=$(date +%s)
          echo "$restore_start" > /tmp/rp-restore-start
          echo "$restore_end" > /tmp/rp-restore-end
          echo 'backup restored into clean filesystem/database and fingerprint verified' > "$MARKERS/clean_environment_restore"
          echo 'post-restore independent state and migration verification passed' > "$MARKERS/restore_verification"

      - name: Record lifecycle environment and RPO/RTO observations
        run: |
          set -euo pipefail
          export RP_WORDPRESS_VERSION="$(wp core version --path="$WP_MAIN")"
          export RP_PHP_VERSION="$(php -r 'echo PHP_VERSION;')"
          export RP_DATABASE_VERSION="$(mysql -h127.0.0.1 -P3306 -uroot -Nse 'SELECT VERSION()')"
          export RP_BACKUP_START="$(cat /tmp/rp-backup-start)"
          export RP_BACKUP_END="$(cat /tmp/rp-backup-end)"
          export RP_RESTORE_START="$(cat /tmp/rp-restore-start)"
          export RP_RESTORE_END="$(cat /tmp/rp-restore-end)"
          python - <<'PY'
          import json, os
          backup_start=int(os.environ['RP_BACKUP_START']); backup_end=int(os.environ['RP_BACKUP_END'])
          restore_start=int(os.environ['RP_RESTORE_START']); restore_end=int(os.environ['RP_RESTORE_END'])
          value={
            'wordpress_version': os.environ['RP_WORDPRESS_VERSION'],
            'php_version': os.environ['RP_PHP_VERSION'],
            'database_version': os.environ['RP_DATABASE_VERSION'],
            'previous_ref': os.environ['PREVIOUS_REF'],
            'candidate_commit': os.environ['GITHUB_SHA'],
            'rpo_seconds': max(0, backup_end-backup_start),
            'rto_seconds': max(0, restore_end-restore_start),
            'backup_window_seconds': max(0, backup_end-backup_start),
            'restore_window_seconds': max(0, restore_end-restore_start),
          }
          with open(os.environ['METRICS'],'w',encoding='utf-8') as f: json.dump(value,f,indent=2,sort_keys=True); f.write('\n')
          PY
          cat "$METRICS"

      - name: Generate exact-SHA upgrade and backup production receipts
        run: |
          set -euo pipefail
          python tests/production-wordpress-lifecycle-receipt.py \
            --commit "$GITHUB_SHA" \
            --marker-dir "$MARKERS" \
            --baseline "$BASELINE" \
            --post-upgrade "$POST_UPGRADE" \
            --post-restore "$POST_RESTORE" \
            --metrics "$METRICS" \
            --environment-id "github-actions-wordpress-lifecycle-${GITHUB_RUN_ID}" \
            --started-at "$(cat /tmp/rp-production-started-at)"

      - name: Independently validate lifecycle receipts with production certifier schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          for name in ('upgrade-migration.json','backup-restore.json'):
              p=Path('evidence/production')/name
              r=json.loads(p.read_text())
              assert r['commit_sha'] == os.environ['GITHUB_SHA']
              assert r['ok'] is True
              assert all(c['ok'] is True and c.get('evidence') for c in r['checks'])
              print('PASS', name)
          PY

      - name: Publish exact-SHA production evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-evidence-wordpress-lifecycle-${{ github.sha }}
          path: |
            evidence/production/upgrade-migration.json
            evidence/production/backup-restore.json
            evidence/production/wordpress-lifecycle-details.json
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          for path in "$WP_MAIN" "$WP_FAIL" "$WP_RESTORE"; do
            echo "=== $path ==="
            wp core version --path="$path" 2>/dev/null || true
            wp plugin list --path="$path" 2>/dev/null || true
          done
          ls -la "$MARKERS" 2>/dev/null || true
          cat "$METRICS" 2>/dev/null || true
