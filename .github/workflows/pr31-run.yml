name: PR31 removal runner
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-browser-live-streaming-20260820
          fetch-depth: 0
      - name: Execute one-shot migration body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/pr31-remove-browser-live.yml').read_text(encoding='utf-8')
          start=source.index("python3 - <<'PY'")+len("python3 - <<'PY'")
          end=source.index("\n          PY", start)
          body=textwrap.dedent(source[start:end])
          exec(compile(body,'pr31-inline','exec'), {'__name__':'__main__'})
          PY
          rm -f .github/workflows/pr31-run.yml
          php -l prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php
          php -l prstudio-unified-control/includes/class-prstudio-uc-rest.php
          node --check prstudio-unified-browser-agent/service-worker.js
          node --check prstudio-unified-browser-agent/sidepanel.js
          php tests/php-browser-live-signaling-smoke.php
          node tests/validate-browser-live-webrtc.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Browser LIVE streaming surface [pr31-patched]"
          git push origin HEAD:chatgpt/remove-browser-live-streaming-20260820
