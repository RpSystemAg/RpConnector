name: Deterministic mission replay

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 2 * * 1'

permissions:
  contents: read

concurrency:
  group: deterministic-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Durable event journal / offline mutation-safe replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime must expose a replayable causal event journal
        run: python3 tests/deterministic-replay-readiness.py | tee /tmp/replay-readiness.txt
      - name: Replay oracle self-test — equal journals pass
        run: |
          cat >/tmp/replay-a.ndjson <<'EOF'
          {"sequence":1,"event_type":"transition","job_uuid":"j","step_id":"s1","state_from":"READY","state_to":"RUNNING","input_hash":"a","output_hash":"b"}
          {"sequence":2,"event_type":"effect","job_uuid":"j","step_id":"s1","effect_id":"e","idempotency_key":"k","executed":true,"final_verdict":"COMPLETED"}
          EOF
          cp /tmp/replay-a.ndjson /tmp/replay-b.ndjson
          python3 tests/deterministic-replay-oracle.py /tmp/replay-a.ndjson /tmp/replay-b.ndjson
      - name: Replay oracle self-test — first divergence must fail
        run: |
          cp /tmp/replay-a.ndjson /tmp/replay-c.ndjson
          python3 - <<'PY'
          import json
          p='/tmp/replay-c.ndjson'
          rows=[json.loads(x) for x in open(p) if x.strip()]
          rows[1]['executed']=False
          with open(p,'w') as f:
              for row in rows: f.write(json.dumps(row,separators=(',',':'))+'\n')
          PY
          set +e
          python3 tests/deterministic-replay-oracle.py /tmp/replay-a.ndjson /tmp/replay-c.ndjson >/tmp/replay-negative.txt 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -F 'REPLAY-DIVERGENCE' /tmp/replay-negative.txt
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-replay-${{ github.sha }}
          path: |
            /tmp/replay-readiness.txt
            /tmp/replay-negative.txt
          if-no-files-found: warn
          retention-days: 30
