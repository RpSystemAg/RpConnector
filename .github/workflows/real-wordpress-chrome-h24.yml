name: Real WordPress + Chrome H24 E2E

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: real-wordpress-chrome-h24-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-real-environment:
    name: Fresh WordPress + MariaDB + Chrome + Browser Agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: rpadmin
      WP_ADMIN_PASSWORD: H24-Real-Browser-Only-2026!
      RP_WP_PATH: /tmp/rpconnector-h24-wp
      PRSTUDIO_TEST_DB_HOST: 127.0.0.1
      PRSTUDIO_TEST_DB_PORT: '3306'
      PRSTUDIO_TEST_DB_USER: root
      PRSTUDIO_TEST_DB_PASS: ''
      PRSTUDIO_TEST_DB_NAME: wordpress_h24

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring, xml
          tools: wp-cli:2.12.0
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Show real runtime versions
        run: |
          set -euo pipefail
          php -v
          wp --info
          node --version
          python --version
          google-chrome --version

      - name: Start fresh MariaDB
        run: |
          set -euo pipefail
          docker run -d --name rpconnector-h24-db \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes \
            -e MARIADB_DATABASE="$PRSTUDIO_TEST_DB_NAME" \
            -p 3306:3306 \
            mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7

          for i in $(seq 1 90); do
            if php -r '$m=@new mysqli("127.0.0.1","root","","",3306); exit($m->connect_errno?1:0);'; then
              exit 0
            fi
            sleep 1
          done

          docker logs rpconnector-h24-db
          exit 1

      - name: Install exact candidate into a fresh real WordPress
        run: |
          set -euo pipefail
          rm -rf "$RP_WP_PATH"
          mkdir -p "$RP_WP_PATH"

          wp core download --path="$RP_WP_PATH" --force
          wp config create \
            --path="$RP_WP_PATH" \
            --dbname="$PRSTUDIO_TEST_DB_NAME" \
            --dbuser=root \
            --dbpass='' \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp config set WP_ENVIRONMENT_TYPE local --path="$RP_WP_PATH"
          wp core install \
            --path="$RP_WP_PATH" \
            --url="$WP_URL" \
            --title='PR STUDIO H24 real browser' \
            --admin_user="$WP_ADMIN_USER" \
            --admin_password="$WP_ADMIN_PASSWORD" \
            --admin_email='h24-e2e@example.invalid' \
            --skip-email

          cp -a prstudio-unified-control "$RP_WP_PATH/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$RP_WP_PATH"

          wp eval --path="$RP_WP_PATH" '
            if (!PRSTUDIO_UC_Store::maybe_upgrade()) {
              fwrite(STDERR, "store upgrade failed\n");
              exit(1);
            }
            echo "PR STUDIO store ready\n";
          '

      - name: Build exact Browser Agent candidate
        run: |
          set -euo pipefail
          python .github/scripts/stamp-browser-build-identity.py --source-sha "$GITHUB_SHA"
          python tests/build-release.py --build
          python .github/scripts/stamp-browser-build-identity.py --source-sha "$GITHUB_SHA" --verify
          python tests/build-release.py --check

      - name: Serve WordPress over real HTTP
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-e2e
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t "$RP_WP_PATH" "$RP_WP_PATH/index.php" \
            > artifacts/real-e2e/wordpress-server.log 2>&1 &
          echo $! > /tmp/rpconnector-h24-wp.pid

          for i in $(seq 1 100); do
            if curl --fail --silent "$WP_URL/wp-login.php" >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done

          cat artifacts/real-e2e/wordpress-server.log
          exit 1

      - name: Select real-browser cycle count
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "E2E_REPEAT=3" >> "$GITHUB_ENV"
          else
            echo "E2E_REPEAT=1" >> "$GITHUB_ENV"
          fi

      - name: Use Chrome as a real user and pair the Browser Agent
        run: |
          set -euo pipefail
          for i in $(seq 1 "$E2E_REPEAT"); do
            echo "=== real WordPress + Chrome cycle $i/$E2E_REPEAT ==="
            export E2E_DEVICE_NAME="GitHub H24 Chrome $i"
            export E2E_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts/real-e2e/run-$i"
            node tests/wordpress-browser-e2e.mjs
          done

      - name: Independent WordPress database oracle
        run: |
          set -euo pipefail
          export EXPECTED="$E2E_REPEAT"
          wp eval --path="$RP_WP_PATH" '
            $expected = (int) getenv("EXPECTED");
            $devices = PRSTUDIO_UC_Store::list_devices();
            $fresh = array_values(array_filter($devices, static function ($device) {
              return "active" === (string) ($device["status"] ?? "")
                && str_starts_with((string) ($device["name"] ?? ""), "GitHub H24 Chrome")
                && isset($device["last_seen_age_seconds"])
                && (int) $device["last_seen_age_seconds"] <= 60;
            }));
            echo wp_json_encode(array(
              "expected" => $expected,
              "fresh_active_devices" => count($fresh),
              "devices" => array_map(static function ($device) {
                return array(
                  "name" => (string) ($device["name"] ?? ""),
                  "status" => (string) ($device["status"] ?? ""),
                  "connection_status" => (string) ($device["connection_status"] ?? ""),
                  "last_seen_age_seconds" => $device["last_seen_age_seconds"] ?? null,
                );
              }, $fresh),
            ), JSON_PRETTY_PRINT), "\n";
            if (count($fresh) < $expected) {
              fwrite(STDERR, "Independent WordPress oracle did not observe all real Chrome pairings.\n");
              exit(1);
            }
          ' | tee artifacts/real-e2e/wordpress-oracle.json

      - name: Collect database diagnostics
        if: always()
        run: |
          set +e
          docker logs rpconnector-h24-db > artifacts/real-e2e/mariadb.log 2>&1
          wp eval --path="$RP_WP_PATH" '
            echo wp_json_encode(PRSTUDIO_UC_Store::queue_stats(), JSON_PRETTY_PRINT), "\n";
          ' > artifacts/real-e2e/queue-stats.json 2>&1
          if [ -f /tmp/rpconnector-h24-wp.pid ]; then
            kill "$(cat /tmp/rpconnector-h24-wp.pid)" 2>/dev/null || true
          fi

      - name: Upload screenshots, browser logs and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-wordpress-chrome-h24-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/real-e2e/
          if-no-files-found: error
          retention-days: 30
