name: Critical kernel mutation testing

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '53 1 * * 6'

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infection:
    name: Infection 0.34.1 / MSI >=90 / covered MSI >=95
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer

      - name: Critical kernel must have a PHPUnit mutation harness
        run: python3 tests/mutation-kernel-readiness.py

      - name: Install project dev dependencies exactly from lock
        run: composer install --no-interaction --no-progress --no-scripts --no-plugins --prefer-dist

      - name: Download exact Infection release and verify GitHub asset digest
        env:
          INFECTION_VERSION: '0.34.1'
        run: |
          set -euo pipefail
          release=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/infection/infection/releases/tags/${INFECTION_VERSION}")
          url=$(jq -r '.assets[] | select(.name=="infection.phar") | .browser_download_url' <<<"$release")
          digest=$(jq -r '.assets[] | select(.name=="infection.phar") | .digest // empty' <<<"$release")
          test -n "$url"
          test -n "$digest"
          test "${digest%%:*}" = 'sha256'
          curl --fail --location --silent --show-error "$url" -o /tmp/infection.phar
          actual="sha256:$(sha256sum /tmp/infection.phar | awk '{print $1}')"
          test "$actual" = "$digest"
          php /tmp/infection.phar --version | tee /tmp/infection-version.txt
          grep -F "$INFECTION_VERSION" /tmp/infection-version.txt

      - name: Baseline PHPUnit suite must be green before mutation
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Mutate the critical runtime kernel
        run: |
          php /tmp/infection.phar \
            --configuration=infection.json5 \
            --threads=max \
            --min-msi=90 \
            --min-covered-msi=95 \
            --show-mutations \
            --no-progress

      - name: Preserve mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-testing-${{ github.sha }}
          path: |
            infection.log
            infection-summary.log
            /tmp/infection-version.txt
          if-no-files-found: warn
          retention-days: 30
