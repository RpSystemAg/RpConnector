name: Reproducible clean build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * 0'

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  double-build:
    name: Two clean source copies / byte-identical release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Derive one SOURCE_DATE_EPOCH from exact commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Independent clean-build reproducibility proof
        run: python3 tests/reproducible-clean-build.py | tee /tmp/reproducible-build.txt
      - name: Preserve reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-build-${{ github.sha }}
          path: /tmp/reproducible-build.txt
          if-no-files-found: warn
          retention-days: 30
