name: Reproducible clean build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * 0'

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  double-build:
    name: Two clean source copies / byte-identical release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Derive one SOURCE_DATE_EPOCH from exact commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Independent clean-build reproducibility proof
        run: python3 tests/reproducible-clean-build.py | tee /tmp/reproducible-build.txt
      - name: Preserve reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducible-build-${{ github.sha }}
          path: /tmp/reproducible-build.txt
          if-no-files-found: warn
          retention-days: 30
