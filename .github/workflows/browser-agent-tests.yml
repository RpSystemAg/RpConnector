name: Browser Agent tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prstudio-unified-browser-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check manifest.json 2>nul || node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - run: node --test tests/*.test.mjs

  wordpress-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: cs2pr
      - name: PHP syntax lint (php -l on every changed-relevant file)
        run: |
          cd prstudio-unified-control
          find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ChatGPT connector / MCP tool-list drift check
        run: node .github/scripts/check-mcp-tool-drift.mjs
      - name: WordPress Plugin Check
        # Informational, not blocking: this tool is calibrated for WordPress.org
        # public-directory submission and flags things like raw fopen()/flock()
        # that this plugin's private signaling store needs intentionally. It
        # still runs and reports every push; see the job log for the full list.
        # Tracked separately: triage and fix the real WordPress.Security.* /
        # PreparedSQL.* findings without chasing every stylistic one.
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './prstudio-unified-control'
