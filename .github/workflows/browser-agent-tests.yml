name: Browser Agent tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-agent-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prstudio-unified-browser-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Stamp exact Browser Agent source identity
        shell: pwsh
        run: python ../.github/scripts/stamp-browser-build-identity.py --source-sha "$env:GITHUB_SHA"
      - name: Generate component MANIFEST/FILE-INTEGRITY
        run: python ../tests/build-release.py --build
      - name: Verify exact Browser Agent source identity
        shell: pwsh
        run: python ../.github/scripts/stamp-browser-build-identity.py --source-sha "$env:GITHUB_SHA" --verify
      - name: Verify deterministic component build
        run: python ../tests/build-release.py --check
      - name: Parse extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"
      - name: Browser Agent deterministic tests
        run: node --test tests/*.test.mjs

  sql-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        # mariadb:11.4 — multi-platform index pinned for reproducible CI.
        image: mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: prstudio_queue_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned SQL parser
        run: python -m pip install --quiet 'sqlglot==30.14.0'
      - name: Every SQL statement the plugin builds must parse as MySQL
        run: python tests/validate-sql-syntax.py
      - name: Every wpdb::prepare must pass as many arguments as it has placeholders
        # Preserved from current master: valid SQL with wrong prepare arity never reaches MySQL.
        run: python tests/validate-prepare-arity.py
      - name: Task queue dispatches against a real database
        env:
          PRSTUDIO_TEST_DB_HOST: 127.0.0.1
          PRSTUDIO_TEST_DB_PORT: '3306'
          PRSTUDIO_TEST_DB_USER: root
          PRSTUDIO_TEST_DB_PASS: ''
          PRSTUDIO_TEST_DB_NAME: prstudio_queue_test
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-task-queue-integration.php
      - name: No claimed write without a statement that reached the server
        # Reads MariaDB's general log back: a mutation that reports 0 must still
        # have sent something. Both defects that stopped this product were
        # statements that never arrived, and both returned a plausible number.
        env:
          PRSTUDIO_TEST_DB_HOST: 127.0.0.1
          PRSTUDIO_TEST_DB_PORT: '3306'
          PRSTUDIO_TEST_DB_USER: root
          PRSTUDIO_TEST_DB_PASS: ''
          PRSTUDIO_TEST_DB_NAME: prstudio_writeobs
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-write-observability-integration.php
      - name: Durable-job liveness and stale-lease recovery against real DB
        env:
          PRSTUDIO_TEST_DB_HOST: 127.0.0.1
          PRSTUDIO_TEST_DB_PORT: '3306'
          PRSTUDIO_TEST_DB_USER: root
          PRSTUDIO_TEST_DB_PASS: ''
          PRSTUDIO_TEST_DB_NAME: prstudio_runtime_liveness
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-runtime-db-liveness-integration.php

  wordpress-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.0'
          tools: cs2pr
      - name: PHP syntax lint
        run: |
          cd prstudio-unified-control
          find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHP smoke suites
        run: |
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-agent-model-constitution.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-mcp-catalog-runtime-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-new-capabilities-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-runtime-recovery-prepare-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-agency-verification-monotonicity-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-browser-parent-reconciliation-smoke.php
      - name: tools/list must stay within the host tool-schema budget
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-tools-list-budget.php
      - name: Required status checks must name jobs that exist
        # Branch protection matches by rendered name, with no link back to the
        # workflow. A renamed job makes the requirement stop matching -- it does
        # not error, it just never fails again, and the branch is then guarded
        # by a permanently green rule. Two agents are renaming jobs in here on
        # the same day, so this has to exist before protections go on.
        run: python3 tests/validate-required-checks.py
      - name: Every test in tests/ must be executed by some workflow
        # A suite nothing runs is not a suite: it passes review, counts in the
        # total, and goes stale silently. 66 were unexecuted when this landed.
        # The baseline may only shrink.
        run: python3 tests/validate-test-inventory.py
      - name: Plugin and extension must still agree on a protocol
        # The two halves are installed and updated separately, by hand, so a
        # user on the previous extension is the normal case. Dropping a
        # protocol strands them while every test still passes.
        run: python3 tests/validate-protocol-compatibility.py
      - name: One-guard constitution
        run: python3 tests/one_guard_constitution.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: ChatGPT connector / MCP tool-list drift check
        run: node .github/scripts/check-mcp-tool-drift.mjs
      - name: BUILD-INFO.json capability/tool count drift check
        run: node .github/scripts/check-build-info-counts.mjs
      - name: WordPress Plugin Check full scan
        # The upstream action's result processor is all-or-nothing: any ERROR
        # fails the step, but this repository already had a measured backlog
        # before the hardening merge accidentally made that processor blocking.
        # Let the collector finish so the next step can apply the exact ratchet;
        # a missing/malformed result still fails there.
        continue-on-error: true
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.8 line
        with:
          build-dir: './prstudio-unified-control'
      - name: WordPress Plugin Check ERROR ratchet (blocking)
        # Baseline is per file + error code. Existing debt may shrink, but any
        # new code/file key or increased count fails the job.
        run: python3 tests/validate-plugin-check-ratchet.py "$RUNNER_TEMP/plugin-check-results.txt"
