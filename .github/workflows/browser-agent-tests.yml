name: Browser Agent tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prstudio-unified-browser-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate component MANIFEST/FILE-INTEGRITY (some tests read them directly)
        run: python ../tests/build-release.py --build
      - run: node --check manifest.json 2>nul || node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - run: node --test tests/*.test.mjs

  # The queue dispatcher shipped broken because nothing in CI ever executed a
  # query. `php -l` passes on a valid string containing invalid SQL, and the
  # PHP smoke tests stub the wpdb object, so a malformed statement was
  # unobservable until it reached a real server. This job is the missing half:
  # a real database, the real schema, the real claim path.
  sql-and-queue:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: prstudio_queue_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL parser
        run: python -m pip install --quiet sqlglot
      - name: Every SQL statement the plugin builds must parse as MySQL
        run: python tests/validate-sql-syntax.py
      - name: Task queue dispatches against a real database
        env:
          PRSTUDIO_TEST_DB_HOST: 127.0.0.1
          PRSTUDIO_TEST_DB_PORT: '3306'
          PRSTUDIO_TEST_DB_USER: root
          PRSTUDIO_TEST_DB_PASS: ''
          PRSTUDIO_TEST_DB_NAME: prstudio_queue_test
        run: php tests/php-task-queue-integration.php

  wordpress-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: cs2pr
      - name: PHP syntax lint (php -l on every changed-relevant file)
        run: |
          cd prstudio-unified-control
          find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: PHP smoke suites
        run: |
          php tests/php-agent-model-constitution.php
          php tests/php-mcp-catalog-runtime-smoke.php
          php tests/php-new-capabilities-smoke.php
      - name: One-guard constitution (anti-crash must stay the only mutation guard)
        run: python3 tests/one_guard_constitution.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ChatGPT connector / MCP tool-list drift check
        run: node .github/scripts/check-mcp-tool-drift.mjs
      - name: BUILD-INFO.json capability/tool count drift check
        run: node .github/scripts/check-build-info-counts.mjs
      - name: WordPress Plugin Check
        # Informational, not blocking: this tool is calibrated for WordPress.org
        # public-directory submission and flags things like raw fopen()/flock()
        # that this plugin's private signaling store needs intentionally. It
        # still runs and reports every push; see the job log for the full list.
        # Tracked separately: triage and fix the real WordPress.Security.* /
        # PreparedSQL.* findings without chasing every stylistic one.
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './prstudio-unified-control'
