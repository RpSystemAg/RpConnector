name: MCP official conformance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * 3'

permissions:
  contents: read

concurrency:
  group: mcp-official-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  referee:
    name: Official referee / MCP 2026-07-28 / suite all
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      db:
        image: mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_PATH: /tmp/rpconnector-mcp-conformance
      WP_URL: http://127.0.0.1:8080
      MCP_CONFORMANCE_VERSION: 0.2.0-alpha.10
      MCP_SPEC_VERSION: 2026-07-28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, curl
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install real WordPress and exact plugin commit
        run: |
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress_test --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_ENVIRONMENT_TYPE local --path="$WP_PATH"
          wp core install --path="$WP_PATH" --url="$WP_URL" --title='MCP conformance' --admin_user=rpadmin --admin_password='Conformance-Only-2026!' --admin_email='conformance@example.invalid' --skip-email
          cp -a prstudio-unified-control "$WP_PATH/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$WP_PATH"
          wp eval --path="$WP_PATH" 'if (!PRSTUDIO_UC_Store::maybe_upgrade()) { exit(1); }'

      - name: Serve eight-worker real WordPress HTTP endpoint
        run: |
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t "$WP_PATH" "$WP_PATH/index.php" > /tmp/mcp-conformance-wp.log 2>&1 &
          echo $! > /tmp/mcp-conformance-wp.pid
          for i in $(seq 1 100); do
            if curl --fail --silent "$WP_URL/.well-known/oauth-authorization-server" >/tmp/mcp-oauth-meta.json; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/mcp-conformance-wp.log
          exit 1

      - name: Pin and inspect official referee inventory
        run: |
          npm --version
          npx -y "@modelcontextprotocol/conformance@${MCP_CONFORMANCE_VERSION}" --help
          npx -y "@modelcontextprotocol/conformance@${MCP_CONFORMANCE_VERSION}" list --spec-version "$MCP_SPEC_VERSION" | tee /tmp/mcp-conformance-scenarios.txt
          test -s /tmp/mcp-conformance-scenarios.txt

      - name: Run official server referee with no expected-failure baseline
        run: |
          # The outer timeout is intentional: upstream has historically lacked a
          # per-scenario server timeout. A referee is not allowed to hang our CI.
          timeout --signal=TERM 25m \
            npx -y "@modelcontextprotocol/conformance@${MCP_CONFORMANCE_VERSION}" server \
              --url "$WP_URL/?rest_route=/prstudio-unified/v1/mcp" \
              --suite all \
              --spec-version "$MCP_SPEC_VERSION" \
              --verbose

      - name: Preserve referee results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-official-conformance-${{ github.sha }}
          path: |
            results
            /tmp/mcp-conformance-scenarios.txt
            /tmp/mcp-oauth-meta.json
            /tmp/mcp-conformance-wp.log
          if-no-files-found: warn
          retention-days: 30
