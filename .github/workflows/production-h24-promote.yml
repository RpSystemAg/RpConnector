name: Production H24 evidence promotion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-h24-promotion-${{ github.sha }}
  cancel-in-progress: false

jobs:
  promote:
    name: Validate and publish 24-hour exact-SHA soak
    runs-on: [self-hosted, rpconnector-production-staging]
    environment: rpconnector-production-staging
    timeout-minutes: 30
    env:
      RP_H24_EVIDENCE_ROOT: ${{ vars.RP_H24_EVIDENCE_ROOT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Copy only exact-SHA external soak evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RP_H24_EVIDENCE_ROOT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_dir="${RP_H24_EVIDENCE_ROOT%/}/$GITHUB_SHA"
          test -d "$source_dir"
          test -f "$source_dir/h24-soak.json"
          test -f "$source_dir/h24-soak-events.ndjson"
          mkdir -p evidence/production
          cp -- "$source_dir/h24-soak.json" evidence/production/h24-soak.json
          cp -- "$source_dir/h24-soak-events.ndjson" evidence/production/h24-soak-events.ndjson

      - name: Revalidate H24 receipt, duration, checks and artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt_path=Path('evidence/production/h24-soak.json')
          events=Path('evidence/production/h24-soak-events.ndjson')
          r=json.loads(receipt_path.read_text(encoding='utf-8'))
          def dt(value):
              value=value[:-1]+'+00:00' if value.endswith('Z') else value
              return datetime.fromisoformat(value).astimezone(timezone.utc)
          assert r.get('gate_id') == 'h24_soak'
          assert r.get('commit_sha') == os.environ['GITHUB_SHA']
          assert r.get('ok') is True
          assert r.get('environment',{}).get('real') is True
          assert r.get('waivers') == [] and r.get('skipped') == []
          assert (dt(r['finished_at'])-dt(r['started_at'])).total_seconds() >= 86400
          required={
            'continuous_24h','periodic_jobs_progress','forced_restart_recovery','zero_orphan_leases',
            'zero_unbounded_queue_growth','zero_fatal_errors','memory_growth_bounded','evidence_chain_complete'
          }
          checks={c.get('id'):c for c in r.get('checks',[]) if isinstance(c,dict)}
          assert set(checks) >= required
          assert all(checks[name].get('ok') is True and checks[name].get('evidence') for name in required)
          artifact=next((a for a in r.get('artifacts',[]) if str(a.get('path','')).endswith('h24-soak-events.ndjson')),None)
          assert artifact is not None
          actual=hashlib.sha256(events.read_bytes()).hexdigest()
          assert actual == artifact.get('sha256')
          assert events.stat().st_size > 0
          print('PASS exact-SHA H24 evidence revalidated')
          PY

      - name: Publish exact-SHA H24 production evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-evidence-h24-${{ github.sha }}
          path: |
            evidence/production/h24-soak.json
            evidence/production/h24-soak-events.ndjson
          if-no-files-found: error
          retention-days: 30
