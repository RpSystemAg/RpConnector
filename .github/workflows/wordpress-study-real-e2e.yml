name: WordPress Study Real E2E

on:
  pull_request:
    branches: [master]
    paths:
      - 'prstudio-unified-control/**'
      - 'prstudio-unified-browser-agent/**'
      - '.github/scripts/wordpress-study-real-e2e.mjs'
      - '.github/workflows/wordpress-study-real-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-study-real-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-study:
    name: Natural prompt → real Chrome → WordPress → Memory/Twin/Skills
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: rpadmin
      WP_ADMIN_PASSWORD: Study-Real-Browser-2026!
      RP_WP_PATH: /tmp/rpconnector-study-wp
      CHROME_BIN: /usr/bin/chromium
      PRSTUDIO_TEST_DB_HOST: 127.0.0.1
      PRSTUDIO_TEST_DB_PORT: '3306'
      PRSTUDIO_TEST_DB_USER: root
      PRSTUDIO_TEST_DB_PASS: ''
      PRSTUDIO_TEST_DB_NAME: wordpress_study
      WORDPRESS_STUDY_FIXTURE: /tmp/wordpress-study-fixture.json
      E2E_DEVICE_NAME: GitHub WordPress Study Chrome
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/wordpress-study-real-e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring, xml
          tools: wp-cli:2.12.0
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Start fresh MariaDB
        run: |
          set -euo pipefail
          mkdir -p "$E2E_ARTIFACT_DIR"
          docker run -d --name rpconnector-study-db \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes \
            -e MARIADB_DATABASE="$PRSTUDIO_TEST_DB_NAME" \
            -p 3306:3306 \
            mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
          for i in $(seq 1 90); do
            if php -r '$m=@new mysqli("127.0.0.1","root","","",3306); exit($m->connect_errno?1:0);'; then exit 0; fi
            sleep 1
          done
          docker logs rpconnector-study-db
          exit 1

      - name: Install exact PR candidate in fresh WordPress
        run: |
          set -euo pipefail
          rm -rf "$RP_WP_PATH"
          mkdir -p "$RP_WP_PATH"
          wp core download --path="$RP_WP_PATH" --version="${RP_WP_VERSION:-7.1}" --force
          wp config create --path="$RP_WP_PATH" --dbname="$PRSTUDIO_TEST_DB_NAME" --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_ENVIRONMENT_TYPE local --path="$RP_WP_PATH"
          wp core install --path="$RP_WP_PATH" --url="$WP_URL" --title='RP STUDIO WordPress study real E2E' --admin_user="$WP_ADMIN_USER" --admin_password="$WP_ADMIN_PASSWORD" --admin_email='study-e2e@example.invalid' --skip-email
          cp -a prstudio-unified-control "$RP_WP_PATH/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$RP_WP_PATH"
          wp eval --path="$RP_WP_PATH" 'if (!PRSTUDIO_UC_Store::maybe_upgrade()) { fwrite(STDERR,"store upgrade failed\n"); exit(1); } echo "store ready\n";'

      - name: Seed deterministic WordPress list-table fixture
        run: |
          set -euo pipefail
          existing=$(wp post list --path="$RP_WP_PATH" --post_type=post --format=ids)
          if [ -n "$existing" ]; then wp post delete --path="$RP_WP_PATH" $existing --force >/dev/null; fi
          wp user meta update "$WP_ADMIN_USER" edit_post_per_page 20 --path="$RP_WP_PATH" >/dev/null
          category_a=$(wp term create category 'Study Alpha' --slug=study-alpha --path="$RP_WP_PATH" --porcelain)
          category_b=$(wp term create category 'Study Beta' --slug=study-beta --path="$RP_WP_PATH" --porcelain)
          : > /tmp/wordpress-study-post-ids.txt
          for i in $(seq -w 1 37); do
            id=$(wp post create --path="$RP_WP_PATH" --post_type=post --post_status=publish --post_title="Study Fixture Post $i" --post_content="Deterministic browser-study fixture $i" --post_category="$category_a" --porcelain)
            echo "$id" >> /tmp/wordpress-study-post-ids.txt
          done
          for i in $(seq -w 1 3); do
            wp post create --path="$RP_WP_PATH" --post_type=page --post_status=publish --post_title="Study Fixture Page $i" --post_content="Page fixture $i" >/dev/null
          done
          wp user create studyviewer1 studyviewer1@example.invalid --role=subscriber --user_pass='ReadOnlyFixture-1!' --path="$RP_WP_PATH" >/dev/null
          wp user create studyviewer2 studyviewer2@example.invalid --role=author --user_pass='ReadOnlyFixture-2!' --path="$RP_WP_PATH" >/dev/null
          jq -Rn '[inputs|select(length>0)|tonumber] | {post_ids:., expected_post_count:length, expected_min_pages:2}' < /tmp/wordpress-study-post-ids.txt > "$WORDPRESS_STUDY_FIXTURE"
          jq -e '.expected_post_count == 37 and .expected_min_pages == 2' "$WORDPRESS_STUDY_FIXTURE"

      - name: Capture independent pre-study mutation oracle
        run: |
          set -euo pipefail
          {
            echo '{"posts":'
            wp post list --path="$RP_WP_PATH" --post_type=post,page --post_status=any --fields=ID,post_type,post_status,post_title,post_modified_gmt --orderby=ID --order=ASC --format=json
            echo ',"users":'
            wp user list --path="$RP_WP_PATH" --fields=ID,user_login,user_email,roles --orderby=ID --order=ASC --format=json
            echo ',"plugins":'
            wp plugin list --path="$RP_WP_PATH" --fields=name,status,version --format=json
            echo ',"categories":'
            wp term list category --path="$RP_WP_PATH" --fields=term_id,name,slug,count --orderby=term_id --order=ASC --format=json
            echo '}'
          } | jq -S . > "$E2E_ARTIFACT_DIR/wordpress-state-before.json"
          sha256sum "$E2E_ARTIFACT_DIR/wordpress-state-before.json" | tee "$E2E_ARTIFACT_DIR/wordpress-state-before.sha256"

      - name: Build exact Browser Agent candidate
        run: |
          set -euo pipefail
          python .github/scripts/stamp-browser-build-identity.py --source-sha "$GITHUB_SHA"
          python tests/build-release.py --build
          python .github/scripts/stamp-browser-build-identity.py --source-sha "$GITHUB_SHA" --verify
          python tests/build-release.py --check

      - name: Serve real WordPress HTTP runtime
        run: |
          set -euo pipefail
          cat > /tmp/rpconnector-study-router.php <<'PHP'
          <?php
          $root = rtrim((string) $_SERVER['DOCUMENT_ROOT'], '/');
          $path = parse_url((string) $_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $path = is_string($path) ? $path : '/';
          $candidate = $root . $path;
          if ($path !== '/' && (is_file($candidate) || is_dir($candidate))) { return false; }
          require $root . '/index.php';
          PHP
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t "$RP_WP_PATH" /tmp/rpconnector-study-router.php > "$E2E_ARTIFACT_DIR/wordpress-server.log" 2>&1 &
          echo $! > /tmp/rpconnector-study-wp.pid
          for i in $(seq 1 100); do
            if curl --fail --silent "$WP_URL/wp-login.php" >/dev/null; then break; fi
            if [ "$i" = 100 ]; then cat "$E2E_ARTIFACT_DIR/wordpress-server.log"; exit 1; fi
            sleep 0.2
          done
          curl --fail --silent "$WP_URL/wp-json/" | jq -e '.namespaces | index("prstudio-unified/v1")' >/dev/null

      - name: Mint ephemeral real MCP token
        run: |
          set -euo pipefail
          wp eval --path="$RP_WP_PATH" '
            $method=(new ReflectionClass("PRSTUDIO_UC_MCP_Auth_V5"))->getMethod("issue_tokens");
            $method->setAccessible(true);
            $tokens=$method->invoke(null,"wordpress-study-real-e2e","prstudio.read prstudio.write offline_access",PRSTUDIO_UC_MCP_Auth_V5::mcp_url());
            if (!is_array($tokens) || empty($tokens["access_token"])) { fwrite(STDERR,"token issuance failed\n"); exit(1); }
            file_put_contents("/tmp/rpconnector-study-token",$tokens["access_token"]);
          '
          token=$(cat /tmp/rpconnector-study-token)
          echo "::add-mask::$token"
          echo "MCP_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          rm -f /tmp/rpconnector-study-token

      - name: Execute natural WordPress study through real MCP + paired Chrome
        run: |
          set -euo pipefail
          node .github/scripts/wordpress-study-real-e2e.mjs

      - name: Independent WP-CLI acceptance oracle
        run: |
          set -euo pipefail
          wp eval --path="$RP_WP_PATH" '
            $fixture=json_decode((string)file_get_contents(getenv("WORDPRESS_STUDY_FIXTURE")),true);
            $module_id=PRSTUDIO_UC_Site_Learning::module_id_for_url(admin_url("/"));
            $module_path=PRSTUDIO_UC_Memory::site_dir()."/site-modules/".$module_id."/module.json";
            if (!is_readable($module_path)) { fwrite(STDERR,"site module missing\n"); exit(1); }
            $module=json_decode((string)file_get_contents($module_path),true);
            $posts=null;
            foreach ((array)($module["tables"]??array()) as $table) { if ((string)($table["section"]??"")==="menu-posts") { $posts=$table; break; } }
            if (!is_array($posts)) { fwrite(STDERR,"posts list table missing\n"); exit(1); }
            $observed=array(); foreach ((array)($posts["rows"]??array()) as $row) { $observed[]=(string)($row["key"]??""); }
            $missing=array_values(array_diff(array_map("strval",(array)($fixture["post_ids"]??array())),$observed));
            $artifact_refs=0; foreach ((array)($module["evidence"]??array()) as $row) { $artifact_refs+=count((array)($row["artifacts"]??array())); }
            $serialized=(string)file_get_contents($module_path);
            $forbidden=preg_match("/data:image\\/|base64,[A-Za-z0-9+\\/=]{100,}|access_token|refresh_token|authorization|cookie|password/i",$serialized)===1;
            $twin=PRSTUDIO_UC_Operational_Twin::snapshot();
            $skills_path=PRSTUDIO_UC_Memory::site_dir()."/skills/procedural-skills-v1.json";
            $skills=is_readable($skills_path)?json_decode((string)file_get_contents($skills_path),true):array();
            $verified_skills=array(); foreach ((array)($skills["skills"]??array()) as $skill) { if ((string)($skill["kind"]??"")==="browser" && (int)($skill["success_count"]??0)>=1) $verified_skills[]=(string)($skill["id"]??""); }
            $report=array(
              "module_id"=>$module_id,"module_revision"=>(int)($module["revision"]??0),"state"=>(string)($module["state"]??""),"surface_hash"=>(string)($module["surface_hash"]??""),
              "visited_urls"=>array_values(array_map(static fn($r)=>(string)($r["url"]??""),(array)($module["navigation"]??array()))),
              "safe_clicks"=>(int)($module["metrics"]["safe_clicks"]??0),"mutation_count"=>(int)($module["metrics"]["mutating_clicks"]??0),"pagination_clicks"=>(int)($module["metrics"]["wordpress_pagination_clicks"]??0),
              "table"=>array("headers"=>$posts["headers"]??array(),"rows_observed"=>(int)($posts["row_count"]??0),"pages_observed"=>(int)($posts["page_count_observed"]??0),"total_pages"=>(int)($posts["total_pages"]??0),"missing_fixture_ids"=>$missing),
              "screenshot_artifact_refs"=>$artifact_refs,"twin"=>$twin,"procedural_skill_ids"=>$verified_skills,"memory_reuse"=>$module["reuse"]??array(),"incremental_skips"=>(int)($module["metrics"]["incremental_skips"]??0),"forbidden_persistence"=>$forbidden,
            );
            echo wp_json_encode($report,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES),"\n";
            $ok=("ready"===(string)($module["state"]??""))
              && (int)($posts["total_pages"]??0)>=2 && (int)($posts["page_count_observed"]??0)>=2 && empty($missing)
              && $artifact_refs>0 && !$forbidden
              && (int)($module["metrics"]["safe_clicks"]??0)>=2 && (int)($module["metrics"]["wordpress_pagination_clicks"]??0)>=1 && 0===(int)($module["metrics"]["mutating_clicks"]??0)
              && (int)($twin["types"]["admin_section"]??0)>=1 && (int)($twin["types"]["list_table"]??0)>=1 && (int)($twin["types"]["column"]??0)>=1
              && !empty($verified_skills) && !empty($module["reuse"]["memory_reused"]) && !empty($module["reuse"]["incremental"]) && (int)($module["metrics"]["incremental_skips"]??0)>=2;
            if (!$ok) { fwrite(STDERR,"WordPress study oracle failed\n"); exit(1); }
          ' | tee "$E2E_ARTIFACT_DIR/wordpress-study-oracle.json"

      - name: Prove study performed zero WordPress data mutations
        run: |
          set -euo pipefail
          {
            echo '{"posts":'
            wp post list --path="$RP_WP_PATH" --post_type=post,page --post_status=any --fields=ID,post_type,post_status,post_title,post_modified_gmt --orderby=ID --order=ASC --format=json
            echo ',"users":'
            wp user list --path="$RP_WP_PATH" --fields=ID,user_login,user_email,roles --orderby=ID --order=ASC --format=json
            echo ',"plugins":'
            wp plugin list --path="$RP_WP_PATH" --fields=name,status,version --format=json
            echo ',"categories":'
            wp term list category --path="$RP_WP_PATH" --fields=term_id,name,slug,count --orderby=term_id --order=ASC --format=json
            echo '}'
          } | jq -S . > "$E2E_ARTIFACT_DIR/wordpress-state-after.json"
          diff -u "$E2E_ARTIFACT_DIR/wordpress-state-before.json" "$E2E_ARTIFACT_DIR/wordpress-state-after.json" | tee "$E2E_ARTIFACT_DIR/wordpress-mutation.diff"
          printf '{"mutation_count":0,"oracle":"WP-CLI state diff","equal":true}\n' > "$E2E_ARTIFACT_DIR/mutation-oracle.json"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          docker logs rpconnector-study-db > "$E2E_ARTIFACT_DIR/mariadb.log" 2>&1
          wp eval --path="$RP_WP_PATH" 'echo wp_json_encode(PRSTUDIO_UC_Store::queue_stats(),JSON_PRETTY_PRINT),"\n";' > "$E2E_ARTIFACT_DIR/queue-stats.json" 2>&1
          if [ -f /tmp/rpconnector-study-wp.pid ]; then kill "$(cat /tmp/rpconnector-study-wp.pid)" 2>/dev/null || true; fi

      - name: Upload real WordPress-study evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpress-study-real-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/wordpress-study-real-e2e/
          if-no-files-found: error
          retention-days: 30
