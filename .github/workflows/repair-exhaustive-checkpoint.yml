name: Repair exhaustive checkpoint source

on:
  push:
    branches:
      - enterprise/schema-contracts-restart-20260819

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[checkpoint-source-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: enterprise/schema-contracts-restart-20260819
      - name: Repair stale guarded bypass in checkpoint source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/exhaustive-checkpoint.py')
          s = p.read_text(encoding='utf-8')
          old = "q=public_question_map('control_action',implemented=implemented or guarded,guarded=guarded,read_only=bool(a.get('read_only')),destructive=bool(a.get('destructive')),annotations_valid=annotation_ok)"
          new = "q=public_question_map('control_action',implemented=implemented,read_only=bool(a.get('read_only')),destructive=bool(a.get('destructive')),annotations_valid=annotation_ok)"
          if old not in s:
              raise SystemExit('expected stale guarded call not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile tests/exhaustive-checkpoint.py
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name 'RpConnector CI repair'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/exhaustive-checkpoint.py
          git commit -m 'Fix exhaustive checkpoint control-action evaluation [checkpoint-source-fixed]'
          git push origin HEAD:enterprise/schema-contracts-restart-20260819
