name: Browser forward compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: browser-forward-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-channels:
    name: Chrome ${{ matrix.channel }} / MV3 kill-restart
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install exact Chrome for Testing channel
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ matrix.channel }}
          install-dependencies: true
      - name: Record actual browser version
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version | tee "/tmp/chrome-${{ matrix.channel }}.txt"
      - name: Load exact Browser Agent in a real fresh profile
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/chrome-extension-live-smoke.mjs
      - name: Force-terminate and reactivate the MV3 service worker
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/chrome-mv3-worker-restart.mjs
      - name: Browser Agent recovery micro-SLO remains bounded
        working-directory: prstudio-unified-browser-agent
        run: node --test tests/remote-recovery-micro-slo.test.mjs
      - name: Preserve channel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-${{ matrix.channel }}-${{ github.sha }}
          path: /tmp/chrome-${{ matrix.channel }}.txt
          if-no-files-found: warn
          retention-days: 30
