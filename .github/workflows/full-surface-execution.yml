name: Unified full-suite control

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-entire-surface:
    name: Entire repository / real WordPress / authenticated MCP / Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: '1'
      PRSTUDIO_TEST_DB_HOST: 127.0.0.1
      PRSTUDIO_TEST_DB_PORT: '3306'
      PRSTUDIO_TEST_DB_USER: root
      PRSTUDIO_TEST_DB_PASS: ''
      PRSTUDIO_TEST_DB_NAME: prstudio_full_surface
      RP_WP_PATH: /tmp/rpconnector-full-surface-wp
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: rpadmin
      WP_ADMIN_PASSWORD: Full-Surface-Only-2026!
      CHROME_BIN: /usr/bin/chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring, xml
          tools: composer, wp-cli:2.12.0
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install mandatory parser, generative and syscall evidence tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y strace
          # tiktoken measures the LAW 9 tools/list ceiling with a real tokenizer
          # instead of the assembler's four-bytes-per-token divisor. Pinned like
          # the others: a tokenizer that changes under us would move the number
          # the law is enforced against.
          python -m pip install --disable-pip-version-check --no-input PyYAML "hypothesis==6.164.0" "tiktoken==0.14.0"
          python - <<'PY'
          import hypothesis, yaml
          assert hypothesis.__version__ == '6.164.0', hypothesis.__version__
          print('Hypothesis', hypothesis.__version__)
          print('PyYAML', yaml.__version__)
          PY
          strace -V
          wp --info
          php -v
          node --version
          python --version
          bash --version | head -n 1

      - name: Deterministic full-repository contract and inventory preflight
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l >/tmp/unified-php-lint.txt
          composer validate --strict --no-check-publish
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-mcp-public-contracts-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/schema-validator-single-file.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/enterprise-schema-batch-1.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/enterprise-schema-batch-2.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-mcp-catalog-runtime-smoke.php
          python3 tests/test-wiring-audit.py
          python .github/scripts/stamp-browser-build-identity.py --source-sha "$GITHUB_SHA"
          python tests/build-release.py --build
          python .github/scripts/stamp-browser-build-identity.py --source-sha "$GITHUB_SHA" --verify
          python tests/build-release.py --check
          node --test prstudio-unified-browser-agent/tests/*.test.mjs
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!composer.lock'; then
            echo 'Merge conflict marker detected.' >&2
            exit 1
          fi

      - name: Start real SQL engine used by integration and WordPress tests
        run: |
          set -euo pipefail
          docker run -d --name rpconnector-full-surface-db \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes \
            -e MARIADB_DATABASE=wordpress_stateful \
            -p 3306:3306 \
            mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
          for i in $(seq 1 90); do
            if php -r '$m=@new mysqli("127.0.0.1","root","", "",3306); exit($m->connect_errno?1:0);'; then
              break
            fi
            if [ "$i" = 90 ]; then
              docker logs rpconnector-full-surface-db
              exit 1
            fi
            sleep 1
          done
          php -r '$m=new mysqli("127.0.0.1","root","", "",3306); if($m->connect_errno){fwrite(STDERR,$m->connect_error);exit(1);} if(!$m->query("CREATE DATABASE IF NOT EXISTS prstudio_full_surface CHARACTER SET utf8mb4")){fwrite(STDERR,$m->error);exit(1);} echo "databases ready\n";'

      - name: Install exact candidate into real WordPress runtime
        run: |
          set -euo pipefail
          rm -rf "$RP_WP_PATH"
          mkdir -p "$RP_WP_PATH"
          wp core download --path="$RP_WP_PATH" --force
          wp config create --path="$RP_WP_PATH" --dbname=wordpress_stateful --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_ENVIRONMENT_TYPE local --path="$RP_WP_PATH"
          wp core install --path="$RP_WP_PATH" --url="$WP_URL" --title='Full surface execution' --admin_user=rpadmin --admin_password='Full-Surface-Only-2026!' --admin_email='full-surface@example.invalid' --skip-email
          wp rewrite structure '/%postname%/' --path="$RP_WP_PATH"
          wp rewrite flush --path="$RP_WP_PATH"
          cp -a prstudio-unified-control "$RP_WP_PATH/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$RP_WP_PATH"
          wp eval --path="$RP_WP_PATH" 'if (!PRSTUDIO_UC_Store::maybe_upgrade()) { fwrite(STDERR,"store upgrade failed\n"); exit(1); } echo "store ready\n";'

      - name: Serve exact plugin and prove a real authenticated MCP request
        run: |
          set -euo pipefail
          cat > /tmp/rpconnector-full-surface-router.php <<'PHP'
          <?php
          $root = rtrim((string) $_SERVER['DOCUMENT_ROOT'], '/');
          $path = parse_url((string) $_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $path = is_string($path) ? $path : '/';
          $candidate = $root . $path;
          if ($path !== '/' && (is_file($candidate) || is_dir($candidate))) {
              return false;
          }
          require $root . '/index.php';
          PHP
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t "$RP_WP_PATH" /tmp/rpconnector-full-surface-router.php > /tmp/rp-full-surface-wp.log 2>&1 &
          echo $! > /tmp/rp-full-surface-wp.pid
          for i in $(seq 1 100); do
            if curl --fail --silent "$WP_URL/.well-known/oauth-authorization-server" >/tmp/rp-full-surface-oauth.json; then
              break
            fi
            if [ "$i" = 100 ]; then
              cat /tmp/rp-full-surface-wp.log
              exit 1
            fi
            sleep 0.2
          done
          jq -e '.issuer and .token_endpoint and .authorization_endpoint' /tmp/rp-full-surface-oauth.json >/dev/null
          curl --fail --silent --output /tmp/rp-full-surface-login.html "$WP_URL/wp-login.php"
          test -s /tmp/rp-full-surface-login.html
          curl --fail --silent "$WP_URL/wp-json/" > /tmp/rp-full-surface-rest-index.json
          jq -e '.namespaces | index("prstudio-unified/v1")' /tmp/rp-full-surface-rest-index.json >/dev/null

          token="$(wp eval --path="$RP_WP_PATH" '$m=new ReflectionMethod(PRSTUDIO_UC_MCP_Auth_V5::class,"issue_tokens"); $m->setAccessible(true); $t=$m->invoke(null,"full-surface-runtime","prstudio.read prstudio.write",PRSTUDIO_UC_MCP_Auth_V5::mcp_url()); if (empty($t["access_token"])) { exit(1); } echo $t["access_token"];' | tail -n 1)"
          test -n "$token"
          case "$token" in prstudio_at_*) ;; *) echo 'generated token format invalid' >&2; exit 1 ;; esac
          echo "::add-mask::$token"
          export RP_MCP_URL="$WP_URL/?rest_route=/prstudio-unified/v1/mcp"
          export RP_MCP_TOKEN="$token"

          python - <<'PY'
          import json, os, urllib.request, urllib.error
          payload=json.dumps({
              'jsonrpc':'2.0','id':'workflow-auth-baseline','method':'ping',
              'params':{'_meta':{
                  'io.modelcontextprotocol/protocolVersion':'2026-07-28',
                  'io.modelcontextprotocol/clientCapabilities':{},
                  'io.modelcontextprotocol/clientInfo':{'name':'full-surface-workflow','version':'1.0'},
              }},
          }).encode()
          req=urllib.request.Request(
              os.environ['RP_MCP_URL'], data=payload, method='POST',
              headers={
                  'Authorization':'Bearer '+os.environ['RP_MCP_TOKEN'],
                  'Content-Type':'application/json',
                  'MCP-Protocol-Version':'2026-07-28',
                  'Mcp-Method':'ping',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=5) as response:
                  status=int(response.status); body=response.read(4096)
          except urllib.error.HTTPError as exc:
              status=int(exc.code); body=exc.read(4096)
          if status not in (200,204):
              raise SystemExit(f'authenticated MCP baseline failed HTTP {status}: {body[:240]!r}')
          print('PASS real authenticated MCP baseline HTTP', status)
          PY

          printf 'RP_MCP_URL=%s\n' "$RP_MCP_URL" >> "$GITHUB_ENV"
          printf 'RP_MCP_TOKEN=%s\n' "$RP_MCP_TOKEN" >> "$GITHUB_ENV"

      - name: Prove real WordPress plus Chrome Browser Agent end to end
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          mkdir -p artifacts/unified-real-e2e
          node .github/scripts/chrome-scripting-health-probe.mjs
          E2E_DEVICE_NAME='Unified full-suite Chrome' \
            E2E_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts/unified-real-e2e" \
            node tests/wordpress-browser-e2e.mjs
          wp eval --path="$RP_WP_PATH" '
            $fresh = array_values(array_filter(PRSTUDIO_UC_Store::list_devices(), static function ($device) {
              return "active" === (string) ($device["status"] ?? "")
                && "Unified full-suite Chrome" === (string) ($device["name"] ?? "")
                && isset($device["last_seen_age_seconds"])
                && (int) $device["last_seen_age_seconds"] <= 60;
            }));
            if (!$fresh) { fwrite(STDERR, "Independent WordPress oracle did not observe the Chrome pairing.\n"); exit(1); }
            echo "real Chrome pairing observed\n";
          '

      - name: Execute exact-checkout 100 percent gate
        run: |
          set -euo pipefail
          python .github/scripts/full-surface-execution.py \
            --registry evidence/full-surface-execution.json \
            --timeout-seconds 180

      - name: Assert exact arithmetic and fail closed
        if: always()
        run: |
          set -euo pipefail
          test -s evidence/full-surface-execution.json
          jq -e '
            .requirements.no_exception_table == true and
            .requirements.no_helper_classification == true and
            .requirements.no_baseline == true and
            .requirements.parse_does_not_count_as_execution == true and
            .requirements.direct_execution_requires_syscall_evidence == true and
            .requirements.required_execution_percent == 100 and
            .counts.syntax_targets == .counts.syntax_passed and
            .counts.total_test_surface_files == .counts.real_executed_files and
            .counts.execution_percent == 100 and
            .ok == true
          ' evidence/full-surface-execution.json

      - name: Show database, WordPress and HTTP evidence on failure
        if: failure()
        run: |
          docker logs rpconnector-full-surface-db || true
          cat /tmp/rp-full-surface-wp.log || true
          wp eval --path="$RP_WP_PATH" 'echo wp_json_encode(PRSTUDIO_UC_Store::queue_stats(), JSON_PRETTY_PRINT),"\n";' || true

      - name: Upload exact-SHA execution registry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-surface-execution-${{ github.sha }}
          path: evidence/full-surface-execution.json
          if-no-files-found: error
          retention-days: 30

