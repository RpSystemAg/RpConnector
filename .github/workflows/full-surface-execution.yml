name: Unified full-suite control

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: unified-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-entire-surface:
    name: Entire repository / real WordPress / authenticated MCP / Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: '1'
      PRSTUDIO_TEST_DB_HOST: 127.0.0.1
      PRSTUDIO_TEST_DB_PORT: '3306'
      PRSTUDIO_TEST_DB_USER: root
      PRSTUDIO_TEST_DB_PASS: ''
      PRSTUDIO_TEST_DB_NAME: prstudio_full_surface
      RP_WP_PATH: /tmp/rpconnector-full-surface-wp
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: rpadmin
      WP_ADMIN_PASSWORD: Full-Surface-Only-2026!
      CHROME_BIN: /usr/bin/chromium
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"unified-full-suite","description":"Unified full suite running","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Execute full repository surface
        run: |
          set -euo pipefail
          python .github/scripts/full-surface-execution.py

      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-full-suite-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success; description='Unified full suite passed' ;;
            cancelled) state=error; description='Unified full suite cancelled' ;;
            *) state=failure; description='Unified full suite failed' ;;
          esac
          jq -n \
            --arg state "$state" \
            --arg context 'unified-full-suite' \
            --arg description "$description" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/unified-full-suite-status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @/tmp/unified-full-suite-status.json
