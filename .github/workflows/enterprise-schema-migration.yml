name: Enterprise schema migration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-schema-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch-contracts:
    name: Enterprise capability contract batch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mbstring
      - name: Lint touched PHP contract/runtime paths
        run: |
          php -l prstudio-unified-control/includes/class-prstudio-uc-agency-capabilities.php
          php -l prstudio-unified-control/includes/class-prstudio-uc-business-intelligence.php
          php -l prstudio-unified-control/includes/class-prstudio-uc-capability-registry.php
          php -l prstudio-unified-control/includes/class-prstudio-uc-schema-validator.php
          php -l tests/enterprise-schema-batch-1.php
          php -l tests/schema-validator-single-file.php
      - name: Validate enterprise contract source JSON
        run: python3 -m json.tool prstudio-unified-control/capabilities/enterprise-capability-contracts.json >/dev/null
      - name: Schema validator regression
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/schema-validator-single-file.php
      - name: Five-capability semantic contract test
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/enterprise-schema-batch-1.php
      - name: Existing Browser orchestrator regression
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/browser-orchestrator-v3-single-file.php prstudio-unified-control/includes/class-prstudio-uc-browser-orchestrator-v3.php
      - name: Existing intelligence regression
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-intelligence-smoke.php
