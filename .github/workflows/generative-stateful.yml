name: Generative and stateful runtime assurance

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

concurrency:
  group: generative-stateful-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hypothesis-real-wordpress:
    name: Hypothesis 6.164.0 / real WordPress / 120 sequences
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      db:
        image: mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: wordpress_stateful
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      RP_WP_PATH: /tmp/rpconnector-stateful-wp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install exact generative engine
        run: |
          python -m pip install --disable-pip-version-check "hypothesis==6.164.0"
          python - <<'PY'
          import hypothesis
          assert hypothesis.__version__ == '6.164.0', hypothesis.__version__
          print('Hypothesis', hypothesis.__version__)
          PY

      - name: Install exact plugin commit into real WordPress
        run: |
          rm -rf "$RP_WP_PATH"
          mkdir -p "$RP_WP_PATH"
          wp core download --path="$RP_WP_PATH" --force
          wp config create --path="$RP_WP_PATH" --dbname=wordpress_stateful --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$RP_WP_PATH" --url=http://127.0.0.1:8080 --title='Stateful property test' --admin_user=rpadmin --admin_password='Stateful-Only-2026!' --admin_email='stateful@example.invalid' --skip-email
          cp -a prstudio-unified-control "$RP_WP_PATH/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$RP_WP_PATH"
          wp eval --path="$RP_WP_PATH" 'if (!PRSTUDIO_UC_Store::maybe_upgrade()) { exit(1); }'

      - name: Generate, execute and shrink real runtime counterexamples
        env:
          HYPOTHESIS_PROFILE: ci
        run: python tests/hypothesis-runtime-stateful.py

      - name: Preserve minimal failing examples and database diagnostics
        if: failure()
        run: |
          wp eval --path="$RP_WP_PATH" 'echo wp_json_encode(PRSTUDIO_UC_Store::queue_stats(), JSON_PRETTY_PRINT),"\n";' || true
          wp db query --path="$RP_WP_PATH" "SELECT status,attempts,max_attempts,COUNT(*) AS n FROM wp_prstudio_uc_jobs GROUP BY status,attempts,max_attempts ORDER BY status,attempts" || true
