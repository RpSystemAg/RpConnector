name: OAuth security invariants

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-concurrency:
    name: OAuth shared-state atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Token/client/rate-limit operations must be atomic
        run: python tests/oauth-concurrency-invariants.py
      - name: MCP OAuth modern protocol requirements
        run: python tests/mcp-2026-07-28-conformance.py
