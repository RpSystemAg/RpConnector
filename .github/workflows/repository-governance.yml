name: Repository governance

on:
  workflow_dispatch:
  schedule:
    - cron: '3 0 * * *'

permissions:
  contents: read
  security-events: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Master protection / required checks / secret push protection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitHub repository controls must be independently provable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tests/repository-governance.py | tee /tmp/repository-governance.json
      - name: Preserve governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-governance-${{ github.sha }}
          path: /tmp/repository-governance.json
          if-no-files-found: warn
          retention-days: 30
