name: Temporary exhaustive diagnostic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run checkpoint and print hard-failure evidence
        shell: bash
        run: |
          set +e
          python3 tests/exhaustive-checkpoint.py --write
          rc=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('EXHAUSTIVE-CHECKPOINT-1.0.0.json').read_text(encoding='utf-8'))
          hard=set(summary.get('hard_failures',[]))
          details=[]
          for raw in Path('EXHAUSTIVE-CHECKPOINT-DETAIL-1.0.0.ndjson').read_text(encoding='utf-8').splitlines():
              item=json.loads(raw)
              details.append(item)
              if item.get('id') in hard:
                  print(json.dumps({
                      'id':item.get('id'),
                      'kind':item.get('kind'),
                      'implementation_status':item.get('implementation_status'),
                      'evidence':item.get('evidence'),
                  },ensure_ascii=False,sort_keys=True))
          ids={item.get('id') for item in details}
          print('HARD_FAILURE_COUNT',len(hard))
          print('NON_ITEM_HARD_FAILURES',json.dumps(sorted(hard-ids),ensure_ascii=False))
          PY
          exit "$rc"
