name: Trace and progress oracle

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: telemetry-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: OpenTelemetry-compatible correlation + anti-loop progress contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mission traces must make progress and causal effects provable
        run: python3 tests/telemetry-progress-readiness.py | tee /tmp/telemetry-progress.txt
      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-progress-oracle-${{ github.sha }}
          path: /tmp/telemetry-progress.txt
          if-no-files-found: warn
          retention-days: 30
