name: PR31 one-shot Browser LIVE removal
on:
  push:
    branches: [chatgpt/remove-browser-live-streaming-20260820]
permissions:
  contents: write
jobs:
  remove-live:
    if: ${{ !contains(github.event.head_commit.message, '[pr31-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-browser-live-streaming-20260820
          fetch-depth: 0
      - name: Remove Browser LIVE/WebRTC surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def subn(text, pattern, repl, expected_min=1, flags=0, label='pattern'):
              out, n = re.subn(pattern, repl, text, flags=flags)
              if n < expected_min:
                  raise SystemExit(f'PR31 patch missed {label}: found {n}, expected >= {expected_min}')
              return out

          # MCP: remove the Browser LIVE app resource, public tools, dispatchers and live-only surface priority.
          p='prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php'; s=read(p)
          s=s.replace("    private const BROWSER_LIVE_URI = 'ui://prstudio/browser-live-v2.html';\n", '')
          s=subn(s, r"\n\s*array\('uri'=>self::BROWSER_LIVE_URI,'name'=>'PR STUDIO Browser LIVE'.*?\)\n", '\n', label='MCP resources/list live row')
          s=subn(s, r"\n\s*if\(\$uri===self::BROWSER_LIVE_URI\)return self::rpc_result\(.*?;", '', label='MCP resources/read live branch')
          s=subn(s, r"\n    private static function browser_live_html\(\): string \{.*?\n    \}\n\n    /\*\*\n     \* Compact model-facing operating contract\.", "\n\n    /**\n     * Compact model-facing operating contract.", flags=re.S, label='MCP live HTML resource')
          s=s.replace("        if('browser_live_attach'===$name){$tool['_meta']=array('ui'=>array('resourceUri'=>self::BROWSER_LIVE_URI,'visibility'=>array('model','app')),'openai/outputTemplate'=>self::BROWSER_LIVE_URI,'openai/widgetAccessible'=>true);}\n", '')
          s=s.replace("        if(in_array($name,array('browser_live_signal','browser_live_stop'),true)){$tool['_meta']=array('ui'=>array('visibility'=>array('app')),'openai/widgetAccessible'=>true);}\n", '')
          s=subn(s, r"^\s*\$tools\[\]=self::tool\('browser_live_(?:attach|signal|stop|status)'.*\n", '', expected_min=4, flags=re.M, label='MCP live tool definitions')
          s=subn(s, r"\n\s*case 'browser_live_attach': \{.*?\n\s*case 'browser_live_status': return PRSTUDIO_UC_Browser_Live::status\(\);", '', flags=re.S, label='MCP live dispatch cases')
          s=s.replace("        'browser_find','browser_live_attach','browser_live_signal','browser_live_stop',\n", "        'browser_find',\n")
          s=s.replace("        'browser' => array( 'browser_open', 'browser_navigate', 'browser_snapshot', 'browser_click', 'browser_fill', 'browser_screenshot', 'browser_tabs', 'browser_live_attach', 'browser_live_status' ),", "        'browser' => array( 'browser_open', 'browser_navigate', 'browser_snapshot', 'browser_click', 'browser_fill', 'browser_screenshot', 'browser_tabs' ),")
          s=s.replace("Open prstudio_context_open only for browser/live concurrency", "Open prstudio_context_open only for browser concurrency")
          s=s.replace("distinguish browser-live, API, cache and memory evidence", "distinguish browser-agent, API, cache and memory evidence")
          s=s.replace("        // Recording a run so a person can watch it back. The extension already\n        // streams a live session over WebRTC, which is a different thing: a\n        // stream is for watching now, a recording is for reviewing what\n        // happened. The catalogue action existed; nothing could ask for it.\n", "        // Recording remains an explicit review artifact; it is independent from the removed live-streaming surface.\n")
          s=s.replace("Start or stop a video recording of the controlled tab, so a run can be reviewed after it finishes rather than only watched live.", "Start or stop a video recording of the controlled tab so a run can be reviewed after it finishes.")
          s=re.sub(r"\n\s*// Browser LIVE tools must be listed.*?\n", '\n', s)
          s=re.sub(r"\n\s*// browser_batch remains searchable\. LIVE attach/signaling/stop are not\n\s*// replaceable because the widget needs all three in its WebRTC loop\.\n", '\n', s)
          if 'browser_live_' in s or 'BROWSER_LIVE_URI' in s or 'PRSTUDIO_UC_Browser_Live' in s:
              raise SystemExit('MCP still exposes Browser LIVE symbols after patch')
          write(p,s)

          # REST: remove device signaling routes/handlers and capability advertisement.
          p='prstudio-unified-control/includes/class-prstudio-uc-rest.php'; s=read(p)
          s=subn(s, r"\n\s*register_rest_route\(\n\s*self::NS,\n\s*'/stream/session',.*?(?=\n\s*register_rest_route\(\n\s*self::NS,\n\s*'/artifact/screenshot')", '\n', flags=re.S, label='REST stream routes')
          s=subn(s, r"\n\tpublic static function stream_session_create\(.*?(?=\n\tpublic static function screenshot_status\(\): array)", '\n', flags=re.S, label='REST stream handlers')
          s=re.sub(r"^\s*'browser_live_webrtc'\s*=>.*?\n", '', s, flags=re.M)
          if '/stream/session' in s or 'PRSTUDIO_UC_Browser_Live' in s or 'browser_live_webrtc' in s:
              raise SystemExit('REST still exposes Browser LIVE after patch')
          write(p,s)

          # Public MCP contract refinements no longer mention the removed tool.
          p='prstudio-unified-control/includes/class-prstudio-uc-public-tool-contracts.php'; s=read(p)
          s=s.replace("        'browser_live_status',\n", '')
          s=subn(s, r"\n\s*case 'browser_live_status':\n.*?\n\s*break;", '', flags=re.S, label='public contract live case')
          write(p,s)

          # Extension worker: remove imports, setup, message paths and tabCapture hooks.
          p='prstudio-unified-browser-agent/service-worker.js'; s=read(p)
          s=subn(s, r"import \{\n\s*livePrepare,\n\s*liveSetupMenus,\n\s*liveHandleContextMenu,\n\s*liveHandleRuntimeMessage,\n\s*liveHandleInternalMessage,\n\s*liveOnCaptureStatusChanged,\n\} from \"\./lib/live-webrtc\.js\";\n", '', label='worker live import')
          s=re.sub(r"^.*live(?:Prepare|SetupMenus)\(\)\.catch\(logError\);.*\n", '', s, flags=re.M)
          s=re.sub(r"\nchrome\.contextMenus\?\.onClicked\?\.addListener\(\(info, tab\) => \{\n\s*liveHandleContextMenu\(info, tab\)\.catch\(logError\);\n\}\);", '', s)
          s=re.sub(r"\nchrome\.tabCapture\?\.onStatusChanged\?\.addListener\(\(info\) => \{\n\s*liveOnCaptureStatusChanged\(info\)\.catch\(logError\);\n\}\);", '', s)
          s=re.sub(r"\nchrome\.action\?\.onClicked\?\.addListener\(.*?prstudio-live-panel.*?\n\}\);", '', s, flags=re.S)
          s=re.sub(r"\n\s*if \(message\?\.target === ['\"]prstudio-live-runtime['\"]\) \{.*?\n\s*\}", '', s, flags=re.S)
          s=re.sub(r"\n\s*if \(message\?\.target === ['\"]prstudio-live-internal['\"]\) \{.*?\n\s*\}", '', s, flags=re.S)
          s=re.sub(r"\n\s*if \(message\?\.target === ['\"]prstudio-live-offscreen['\"]\) \{.*?\n\s*\}", '', s, flags=re.S)
          # Any remaining direct live handler lines are dead one-statement branches; remove them rather than retaining hidden policy surface.
          s=re.sub(r"^.*(?:liveHandleRuntimeMessage|liveHandleInternalMessage|liveHandleContextMenu|liveOnCaptureStatusChanged|livePrepare|liveSetupMenus).*\n", '', s, flags=re.M)
          write(p,s)

          # Side panel JS: remove Browser LIVE state, listeners and polling entirely.
          p='prstudio-unified-browser-agent/sidepanel.js'; s=read(p)
          s=s.replace("const sendLive = (type, extra = {}) => chrome.runtime.sendMessage({ target: 'prstudio-live-runtime', type, ...extra });\n", '')
          s=subn(s, r"\n// Chrome grants activeTab only to the tab that was active at a recognized.*?function tabIsGranted\(tabId\) \{.*?\}\n", '\n', flags=re.S, label='sidepanel live grant state')
          s=subn(s, r"\nasync function activeLiveTab\(\) \{.*?(?=\n// Remote/pairing contract: intentionally unchanged\.)", '\n', flags=re.S, label='sidepanel live UI logic')
          s=re.sub(r"^activeLiveTab\(\).*\n", '', s, flags=re.M)
          s=s.replace("  createRefreshLoop(refreshLive, { intervalMs: 4_000 }),\n", '')
          write(p,s)

          # Remove the compatibility placeholder from the UI now that its JS is gone.
          p='prstudio-unified-browser-agent/sidepanel.html'; s=read(p)
          s=subn(s, r"\n<section id=\"liveWebRtc\" hidden aria-hidden=\"true\">.*?</section>", '', flags=re.S, label='sidepanel live placeholder')
          write(p,s)

          # Actual producer module is no longer referenced; offscreen files were already removed in this branch.
          Path('prstudio-unified-browser-agent/lib/live-webrtc.js').unlink(missing_ok=True)

          # Keep historical test paths in the execution registry, but invert them into regression guards for removal.
          write('tests/php-browser-live-signaling-smoke.php', '''<?php
          define('PRSTUDIO_UC_TESTING', true);
          $root=dirname(__DIR__);
          $mcp=file_get_contents($root.'/prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php');
          $rest=file_get_contents($root.'/prstudio-unified-control/includes/class-prstudio-uc-rest.php');
          $autoload=file_get_contents($root.'/prstudio-unified-control/includes/class-prstudio-uc-autoload.php');
          foreach (array('browser_live_attach','browser_live_signal','browser_live_stop','browser_live_status','BROWSER_LIVE_URI','PRSTUDIO_UC_Browser_Live') as $needle) {
              if (strpos($mcp,$needle)!==false) { fwrite(STDERR,"FAIL MCP still contains $needle\\n"); exit(1); }
          }
          if (strpos($rest,'/stream/session')!==false || strpos($rest,'PRSTUDIO_UC_Browser_Live')!==false) { fwrite(STDERR,"FAIL REST streaming surface remains\\n"); exit(1); }
          if (strpos($autoload,'PRSTUDIO_UC_Browser_Live')!==false) { fwrite(STDERR,"FAIL autoload mapping remains\\n"); exit(1); }
          if (is_file($root.'/prstudio-unified-control/includes/class-prstudio-uc-browser-live.php')) { fwrite(STDERR,"FAIL Browser LIVE server class remains\\n"); exit(1); }
          fwrite(STDOUT,"OK Browser LIVE server surface removed\\n");
          ''')
          write('tests/validate-browser-live-webrtc.mjs', '''import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync(new URL('../prstudio-unified-browser-agent/manifest.json',import.meta.url),'utf8'));
          const perms=new Set(manifest.permissions||[]);
          for (const p of ['tabCapture','offscreen','contextMenus']) if (perms.has(p)) throw new Error(`removed Browser LIVE permission still present: ${p}`);
          const panel=fs.readFileSync(new URL('../prstudio-unified-browser-agent/sidepanel.html',import.meta.url),'utf8');
          for (const needle of ['Browser LIVE','WebRTC','liveStartButton','liveWebRtc']) if (panel.includes(needle)) throw new Error(`removed streaming UI remains: ${needle}`);
          for (const f of ['offscreen-live.html','offscreen-live.js','lib/live-webrtc.js']) if (fs.existsSync(new URL(`../prstudio-unified-browser-agent/${f}`,import.meta.url))) throw new Error(`removed live runtime remains: ${f}`);
          console.log('OK Browser LIVE/WebRTC extension surface removed');
          ''')

          # Remove the one-shot workflow itself from the resulting PR tree.
          Path('.github/workflows/pr31-remove-browser-live.yml').unlink(missing_ok=True)
          PY

          php -l prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php
          php -l prstudio-unified-control/includes/class-prstudio-uc-rest.php
          node --check prstudio-unified-browser-agent/service-worker.js
          node --check prstudio-unified-browser-agent/sidepanel.js
          php tests/php-browser-live-signaling-smoke.php
          node tests/validate-browser-live-webrtc.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Browser LIVE streaming surface [pr31-patched]"
          git push origin HEAD:chatgpt/remove-browser-live-streaming-20260820
