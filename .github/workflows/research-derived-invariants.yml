
# Invariants derived from published measurements, run as one named gate.
#
# Why a separate workflow when "Full surface execution 100 percent" already runs
# every file under tests/:
#
#   Speed and blast radius. The full-surface gate provisions MariaDB, installs
#   WordPress, serves it and proves an authenticated MCP request before it runs
#   anything. That is correct for a 100% execution contract and it is slow, and
#   it goes red for reasons that have nothing to do with these invariants. These
#   checks need no database, no WordPress and no network, so they can answer in
#   under a minute and say something specific when they fail.
#
#   Requireability. Branch protection matches a required check by its rendered
#   name. A gate named for what it protects can be required; "one of 164 files
#   in the surface run" cannot. The job name here is deliberately static --
#   tests/validate-required-checks.py rejects names built from github.* context
#   precisely because a requirement that stops matching never fails again.
#
# This does not replace the full-surface contract and does not weaken it. Every
# file listed here is also executed there, under LAW 11, with syscall evidence.
# Running it twice is the point: fast and specific here, exhaustive there.
#
# Each check below cites the measurement it came from. If one starts failing,
# the paper is the place to go to decide whether the invariant or the product is
# wrong.

name: Research-derived invariants

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-derived-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Research-derived invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mbstring, json
          coverage: none

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the tokenizer the token ceiling is measured with
        # Pinned deliberately. An unpinned tokenizer would move the number LAW 9
        # is enforced against, which is the opposite of what this gate is for.
        run: python -m pip install --disable-pip-version-check --no-input "tiktoken==0.14.0"

      - name: Trajectory must still match what the user authorized
        # arXiv:2608.17718. A mission can call the right handler with plausible
        # arguments at every step while the trajectory slides toward a broader
        # role, an adjacent objective, or evidence nobody supplied. Also asserts
        # the monitor stays non-blocking on drifting fixtures (LAW 1) and that
        # evaluation is a pure function, so the trust trajectory replays.
        run: php -d auto_prepend_file=tests/strict-php-errors.php -f tests/php-trust-trajectory-smoke.php

      - name: A procedural skill must earn reuse across repeated evidence
        # arXiv:2608.17587. Agent-authored skills perform 8-11 points worse than
        # no skill when trusted from a single sample. Confidence used to reach
        # 0.67 after one success against a 0.5 reuse bar, and observed failures
        # scored nothing at all.
        run: php -d auto_prepend_file=tests/strict-php-errors.php -f tests/php-procedural-skill-confidence-smoke.php

      - name: The tools/list ceiling measured, not estimated
        # arXiv:2608.17433 found full harness provision is not accuracy-optimal:
        # a task-specific harness beat it 0.715 to 0.652 with 48% fewer tokens.
        # LAW 9's ceiling is therefore a feature, and it has to be measured
        # against a real tokenizer rather than a four-bytes-per-token divisor
        # that nobody had ever checked.
        run: python tests/validate-tools-list-real-tokens.py

      - name: Anti-crash remains the only mutation guard
        # LAW 1. Listed here because every invariant above reports evidence and
        # none of them may become a second guard. This is the check that says so.
        run: python tests/one_guard_constitution.py

      - name: Plugin and extension still agree on a protocol
        # The two halves are installed and updated separately, by hand, so a
        # user running the previous extension is the normal case.
        run: python tests/validate-protocol-compatibility.py

      - name: Every wpdb::prepare passes as many arguments as it has placeholders
        # A mismatch makes prepare() return '' and the statement is never sent,
        # which the caller reads as "no rows". That is how stale-lease recovery
        # sat dead.
        run: python tests/validate-prepare-arity.py
