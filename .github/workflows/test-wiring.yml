name: Test wiring completeness

on:
  workflow_dispatch:
  schedule:
    - cron: '31 0 * * *'

permissions:
  contents: read

concurrency:
  group: test-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reachability:
    name: Every test/audit/conformance file must be reachable from CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit test execution graph
        run: python3 tests/test-wiring-audit.py | tee /tmp/test-wiring.txt
      - name: Preserve wiring inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-wiring-${{ github.sha }}
          path: /tmp/test-wiring.txt
          if-no-files-found: warn
          retention-days: 30
