name: Production certification

on:
  workflow_dispatch:
  push:
    tags:
      - 'production-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: production-certification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-and-evidence:
    name: Production proof for exact commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring

      - name: Compile production certification tooling
        run: |
          python -m py_compile \
            tests/production-readiness-certifier.py \
            tests/production-readiness-certifier-selftest.py \
            tests/production-source-integrity.py \
            tests/production-test-plan-audit.py \
            tests/production-h24-soak.py \
            tests/production-fault-injection.py \
            tests/production-scenario-gate.py \
            tests/production-wordpress-lifecycle-receipt.py \
            tests/production-workflow-evidence.py \
            tests/production-supply-chain-source.py \
            tests/production-documentation-claims.py \
            tests/generate-production-sbom.py \
            tests/collect-production-evidence.py \
            tests/atomic-capability-assurance.py

      - name: Production certifier must reject manufactured green evidence
        run: python tests/production-readiness-certifier-selftest.py

      - name: Production test-plan structure must be honest and complete
        run: python tests/production-test-plan-audit.py

      - name: Enterprise source invariants
        run: |
          python tests/enterprise-static-audit.py
          python tests/mcp-2026-07-28-conformance.py
          python tests/runtime-invariants-audit.py
          python tests/runtime-state-model-check.py
          python tests/runtime-chaos-model.py
          python tests/one_guard_constitution.py

      - name: Generated contracts must match source
        run: |
          python tests/regenerate-contract-artifacts.py --php-binary php --check
          node .github/scripts/check-mcp-tool-drift.mjs
          node .github/scripts/check-build-info-counts.mjs

      - name: Generate release integrity artifacts for exact commit
        run: python tests/build-release.py --build

      - name: Strict release validation
        run: node tests/validate-release.mjs --strict --php-smoke

      - name: Generated release artifacts must be reproducible
        run: git diff --exit-code

      - name: Generate and require source-integrity production receipt
        run: python tests/production-source-integrity.py --commit "$GITHUB_SHA" --strict

      - name: Require executable item-level capability proof
        run: python tests/atomic-capability-assurance.py --execute --strict

      - name: Collect successful external production artifacts for exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/collect-production-evidence.py --commit "$GITHUB_SHA" --strict

      - name: Convert exact-SHA workflow jobs into static, platform and supply-chain receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/production-workflow-evidence.py --commit "$GITHUB_SHA" --strict

      - name: Documentation and release claims must not exceed source or evidence
        run: python tests/production-documentation-claims.py --commit "$GITHUB_SHA" --strict

      - name: AGENT-BENCH must be measured, not calibrated
        run: python bench/agent-bench-status.py

      - name: Preserve legacy E6-E8 live-evidence gate
        run: python tests/release-evidence-gate.py --require-production-proof --commit "$GITHUB_SHA"

      - name: Final fail-closed production readiness verdict
        run: python tests/production-readiness-certifier.py --strict --commit "$GITHUB_SHA"
