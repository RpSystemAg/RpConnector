name: Runtime invariants

on:
  push:
    branches:
      - master
      - 'hardening/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-runtime-model:
    name: Exhaustive finite-state model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exhaustively prove finite runtime model invariants
        run: python3 tests/runtime-state-model-check.py

  architectural-invariants:
    name: Architectural invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runtime invariant audit
        run: python3 tests/runtime-invariants-audit.py

  recovery-prepare-arity:
    name: Recovery SQL prepare arity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: php -l tests/php-runtime-recovery-prepare-smoke.php
      - name: Strict wpdb prepare arity
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-runtime-recovery-prepare-smoke.php

  verification-monotonicity:
    name: Verification monotonicity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: php -l tests/php-agency-verification-monotonicity-smoke.php
      - name: Weak child evidence cannot become verified mission evidence
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-agency-verification-monotonicity-smoke.php

  browser-parent-regression:
    name: Browser parent reconciliation regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Existing parent reconciliation smoke
        run: php -d auto_prepend_file=tests/strict-php-errors.php tests/php-browser-parent-reconciliation-smoke.php
