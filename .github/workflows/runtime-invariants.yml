name: Runtime invariants

on:
  push:
    branches:
      - master
      - 'hardening/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architectural-invariants:
    name: Architectural invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Runtime invariant audit
        run: python3 tests/runtime-invariants-audit.py

  php-runtime-smokes:
    name: PHP runtime smokes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint invariant tests
        run: |
          php -l tests/php-runtime-recovery-prepare-smoke.php
          php -l tests/php-agency-verification-monotonicity-smoke.php
      - name: Strict wpdb prepare arity
        run: php tests/php-runtime-recovery-prepare-smoke.php
      - name: Verification monotonicity
        run: php tests/php-agency-verification-monotonicity-smoke.php
      - name: Existing browser parent reconciliation regression
        run: php tests/php-browser-parent-reconciliation-smoke.php
