name: Static analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-matrix:
    name: PHP ${{ matrix.php }} (declared floor is 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
      - name: Confirm the declared minimum still matches this matrix
        run: |
          declared=$(grep -oP 'Requires PHP:\s*\K[0-9.]+' prstudio-unified-control/prstudio-unified-control.php)
          echo "plugin header declares PHP $declared"
          test "$declared" = "8.0"
      - name: Syntax check every production PHP file
        run: find prstudio-unified-control -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: Execute runtime-facing suites on this PHP version
        run: |
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-agent-model-constitution.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-mcp-catalog-runtime-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-tools-list-budget.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-new-capabilities-smoke.php
          php -d auto_prepend_file=tests/strict-php-errors.php tests/php-intelligence-smoke.php

  phpstan-wordpress:
    name: PHPStan 2.2.7 + WordPress 6.9.4 stubs (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          tools: composer
          coverage: none
      - name: Validate immutable Composer toolchain
        run: composer validate --strict --no-check-publish
      - name: Install exact static-analysis dependencies from composer.lock
        run: composer install --no-interaction --no-progress --no-scripts --no-plugins --prefer-dist
      - name: Verify exact tool versions
        run: |
          test "$(composer show phpstan/phpstan --format=json | jq -r .versions[0])" = "2.2.7"
          test "$(composer show php-stubs/wordpress-stubs --format=json | jq -r .versions[0])" = "v6.9.4"
          test "$(composer show szepeviktor/phpstan-wordpress --format=json | jq -r .versions[0])" = "v2.0.3"
          vendor/bin/phpstan --version
      - name: Analyze the entire production PHP surface
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=1G

  megalinter:
    name: MegaLinter whole repository (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Materialize locked WordPress model for MegaLinter PHPStan
        run: composer install --no-interaction --no-progress --no-scripts --no-plugins --prefer-dist
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/php@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          DISABLE_ERRORS: false
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: megalinter-report-${{ github.sha }}
          path: megalinter-reports
          if-no-files-found: warn
          retention-days: 14
