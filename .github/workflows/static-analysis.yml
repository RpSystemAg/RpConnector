name: Static analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Run the suite on the PHP version the plugin actually claims to support.
  #
  # This replaced a PHPCompatibility gate that could not do the job. The idea
  # was sound -- the plugin header declares "Requires PHP: 8.0" and nothing
  # verified it -- but the stable PHPCompatibility release predates PHP 8.0 and
  # has no data for 8.1 functions, so it silently reported clean for exactly the
  # calls it was supposed to catch. A self-test proved that: a fixture calling a
  # known PHP 8.1 function came back unflagged.
  #
  # Executing the code on 8.0 has no such blind spot. A call to a function that
  # does not exist there is a fatal, and the suites are what surface it.
  # `php -l` cannot: calling an undefined function is valid syntax.
  php-matrix:
    name: PHP ${{ matrix.php }} (declared floor is 8.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
      - name: Confirm the declared minimum still matches this matrix
        run: |
          declared=$(grep -oP 'Requires PHP:\s*\K[0-9.]+' prstudio-unified-control/prstudio-unified-control.php)
          echo "plugin header declares PHP $declared"
          if [ "$declared" != "8.0" ]; then
            echo "::error::Header declares PHP $declared but the matrix floor is 8.0. Change both together."
            exit 1
          fi
      - name: Syntax check every file
        run: find prstudio-unified-control -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: Execute the suites on this PHP version
        run: |
          php tests/php-agent-model-constitution.php
          php tests/php-mcp-catalog-runtime-smoke.php
          php tests/php-tools-list-budget.php
          php tests/php-new-capabilities-smoke.php
          php tests/php-intelligence-smoke.php

  # Broad multi-language linting, run as a ratchet.
  #
  # The repo predates the linter, so a full sweep reports a long tail of
  # findings nobody in the current change introduced. Two runs, two postures:
  #
  #   master push    -> whole codebase, advisory. Measures the standing backlog
  #                     without blocking work on debt that is already there.
  #   everything else-> changed files only, BLOCKING. New code has to be clean.
  #
  # So the backlog can only shrink. It was worth saying plainly: the earlier
  # version of this job was advisory in both directions, which made it a report
  # nobody had to act on.
  megalinter:
    name: MegaLinter (${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'full sweep, advisory' || 'changed files, blocking' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # MegaLinter diffs against the base ref to decide what changed.
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/php@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These two move together and must stay in sync: the full sweep is the
          # only run allowed to be advisory. Splitting them would either block on
          # the backlog or let new findings through.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          DISABLE_ERRORS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-report
          path: |
            megalinter-reports
          retention-days: 14
