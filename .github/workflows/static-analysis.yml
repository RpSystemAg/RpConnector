name: Static analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The one that would have caught the real bug.
  #
  # PRSTUDIO_UC_Schema_Validator called array_is_list(), added in PHP 8.1, while
  # the plugin header declares "Requires PHP: 8.0" -- a guaranteed fatal Error on
  # a supported install, on the first tool call carrying arguments. `php -l`
  # cannot see it (calling a function that does not exist at runtime is valid
  # syntax) and CI lints on a newer PHP where the function is present.
  #
  # PHPCompatibility reads the declared floor from the plugin header and flags
  # every call the target version cannot make. This job is blocking on purpose:
  # shipping code that fatals on the version you advertise is not a style issue.
  php-compatibility:
    name: PHP 8.0 compatibility (the declared minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Install PHPCS and PHPCompatibility
        run: |
          # Composer 2.2+ blocks plugins unless allowed. The installer plugin is
          # what registers PHPCompatibility as a PHPCS standard, so without this
          # the standard is installed but invisible to phpcs.
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer:^3.10 \
            phpcompatibility/phpcompatibility-wp:^2.1 \
            dealerdirect/phpcodesniffer-composer-installer:^1.0
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"
      - name: Confirm PHPCompatibilityWP registered as a standard
        run: phpcs -i
      - name: Confirm the declared minimum matches what we test
        run: |
          declared=$(grep -oP 'Requires PHP:\s*\K[0-9.]+' prstudio-unified-control/prstudio-unified-control.php)
          echo "plugin header declares PHP $declared"
          if [ "$declared" != "8.0" ]; then
            echo "::error::Plugin header declares PHP $declared but this job tests 8.0-. Update both together."
            exit 1
          fi
      # Prove the check actually detects the defect class it exists for, rather
      # than trusting that a green run means anything. array_is_list() is the
      # real bug that shipped; if this fixture stops being flagged, the job has
      # silently stopped protecting us.
      - name: Self-test — the check must flag a PHP 8.1 function under 8.0
        run: |
          mkdir -p /tmp/compat-selftest
          printf '<?php\nfunction probe(array $v): bool { return array_is_list($v); }\n' > /tmp/compat-selftest/probe.php
          if phpcs -p /tmp/compat-selftest --standard=PHPCompatibilityWP \
               --runtime-set testVersion 8.0- --extensions=php --report=full --warning-severity=0; then
            echo "::error::Self-test failed: array_is_list() was NOT flagged under PHP 8.0. The compatibility gate is not working."
            exit 1
          fi
          echo "Self-test passed: the gate detects PHP 8.1 functions used under an 8.0 floor."

      - name: Fail on any call the declared minimum cannot make
        # RemovedExtensions is excluded because it matches on function-name
        # prefix and cannot tell a class method from a global function: it flags
        # PRSTUDIO_UC_MCP_Toolchain::sqlite_query() as the ext/sqlite function
        # removed in PHP 5.4. That method uses SQLite3 and PDO, both current.
        # The sniffs that matter here -- NewFunctions, NewClasses, RemovedFunctions
        # -- are untouched, and the self-test above proves it.
        run: |
          phpcs -p prstudio-unified-control \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion 8.0- \
            --extensions=php \
            --ignore='*/vendor/*,*/node_modules/*' \
            --exclude=PHPCompatibility.Extensions.RemovedExtensions \
            --report=full \
            --warning-severity=0

  # Broad multi-language linting. Advisory: this repo predates it, so a first run
  # surfaces a long tail of pre-existing style findings. Blocking on those would
  # train everyone to ignore the job, which is how a real finding gets missed.
  # Read the report, fix in batches, and tighten specific linters to blocking
  # once their backlog is clear.
  megalinter:
    name: MegaLinter (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # MegaLinter diffs against the base ref to decide what changed.
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/php@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-report
          path: |
            megalinter-reports
          retention-days: 14
