name: Static analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the suite on the PHP version the plugin actually claims to support.
  #
  # This is the surviving half of a merge. The other side proposed a
  # PHPCompatibility gate against `testVersion 8.0-`, which is the more obvious
  # way to check a declared minimum and is what most projects do. It was tried
  # here and it does not work: the stable PHPCompatibility release predates PHP
  # 8.0 and carries no data for 8.1 functions, so a fixture calling a known 8.1
  # function came back unflagged. It reported clean for precisely the calls it
  # existed to catch.
  #
  # Executing the code on 8.0 has no such blind spot. Calling a function that
  # does not exist there is a fatal, and the suites surface it. `php -l` cannot:
  # calling an undefined function is valid syntax.
  php-matrix:
    name: PHP ${{ matrix.php }} (declared floor is 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
      - name: Confirm the declared minimum still matches this matrix
        run: |
          declared=$(grep -oP 'Requires PHP:\s*\K[0-9.]+' prstudio-unified-control/prstudio-unified-control.php)
          echo "plugin header declares PHP $declared"
          if [ "$declared" != "8.0" ]; then
            echo "::error::Header declares PHP $declared but the matrix floor is 8.0. Change both together."
            exit 1
          fi
      - name: Syntax check every file
        run: find prstudio-unified-control -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: Execute the suites on this PHP version
        run: |
          php tests/php-agent-model-constitution.php
          php tests/php-mcp-catalog-runtime-smoke.php
          php tests/php-tools-list-budget.php
          php tests/php-new-capabilities-smoke.php
          php tests/php-intelligence-smoke.php

  # Broad multi-language linting, run as a ratchet.
  #
  # Two runs, two postures, because the repo predates the linter:
  #   master push     -> whole codebase, advisory. Measures the standing backlog.
  #   everything else -> changed files only, BLOCKING. New code has to be clean.
  #
  # The other side of this merge set VALIDATE_ALL_CODEBASE: true with errors
  # blocking on every event. That posture is only reachable once the backlog is
  # clear, and it is not: the first full sweep reported 812 phpstan findings.
  # Turning it on now would leave master permanently red, which teaches people
  # to ignore the colour. The ratchet reaches the same end state -- backlog can
  # only shrink -- without a wall in front of unrelated work.
  megalinter:
    name: MegaLinter (${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'full sweep, advisory' || 'changed files, blocking' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # MegaLinter diffs against the base ref to decide what changed.
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/php@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These two move together on purpose: the full sweep is the only run
          # allowed to be advisory. Split them and you get either a gate that
          # blocks on pre-existing debt or one that lets new findings through.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          DISABLE_ERRORS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: megalinter-report-${{ github.sha }}
          path: |
            megalinter-reports
          if-no-files-found: warn
          retention-days: 14
