name: Production real staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-real-staging-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-staging:
    name: Real staging scenario and fault certification
    runs-on: [self-hosted, rpconnector-production-staging]
    environment: rpconnector-production-staging
    timeout-minutes: 360
    env:
      # Profiles must contain argv only. Real credentials/endpoints belong in the
      # runner/environment and are read by the invoked staging scripts, never
      # embedded in argv because argv is preserved as production evidence.
      RP_SCENARIO_PROFILE_JSON: ${{ secrets.RP_PRODUCTION_SCENARIO_PROFILE_JSON }}
      RP_FAULT_PROFILE_JSON: ${{ secrets.RP_PRODUCTION_FAULT_PROFILE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify exact checkout and real profile availability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$RP_SCENARIO_PROFILE_JSON"
          test -n "$RP_FAULT_PROFILE_JSON"
          printf '%s' "$RP_SCENARIO_PROFILE_JSON" > /tmp/rp-production-scenarios.json
          printf '%s' "$RP_FAULT_PROFILE_JSON" > /tmp/rp-production-faults.json
          chmod 600 /tmp/rp-production-scenarios.json /tmp/rp-production-faults.json
          python - <<'PY'
          import json
          for path in ('/tmp/rp-production-scenarios.json','/tmp/rp-production-faults.json'):
              value=json.load(open(path,encoding='utf-8'))
              assert value.get('real') is True, f'{path}: real=true required'
              assert value.get('environment_id'), f'{path}: environment_id required'
          print('real staging profiles accepted')
          PY

      - name: Execute all real independent-oracle production gates
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            auth_security \
            browser_isolation \
            transaction_integrity \
            concurrency_recovery \
            load_backpressure \
            remote_live_integration \
            observability_operability \
            compatibility_degradation
          do
            echo "=== production gate: $gate ==="
            python tests/production-scenario-gate.py \
              --profile /tmp/rp-production-scenarios.json \
              --gate "$gate" \
              --commit "$GITHUB_SHA" \
              --strict
          done

      - name: Execute all destructive real fault-injection scenarios
        shell: bash
        run: |
          set -euo pipefail
          python tests/production-fault-injection.py \
            --profile /tmp/rp-production-faults.json \
            --commit "$GITHUB_SHA" \
            --strict

      - name: Cross-check every staging receipt before publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          names=[
            'auth-security.json','browser-isolation.json','transaction-integrity.json',
            'concurrency-recovery.json','load-backpressure.json','remote-live-integration.json',
            'observability-operability.json','compatibility-degradation.json','fault-injection.json'
          ]
          for name in names:
              path=Path('evidence/production')/name
              value=json.loads(path.read_text(encoding='utf-8'))
              assert value['commit_sha'] == os.environ['GITHUB_SHA'], name
              assert value['ok'] is True, name
              assert value['environment']['real'] is True, name
              assert value['waivers'] == [] and value['skipped'] == [], name
              assert all(c.get('ok') is True and c.get('evidence') for c in value['checks']), name
              print('PASS', name)
          PY

      - name: Publish exact-SHA real-staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-evidence-real-staging-${{ github.sha }}
          path: evidence/production
          if-no-files-found: error
          retention-days: 30

      - name: Destroy transient profile files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/rp-production-scenarios.json /tmp/rp-production-faults.json
