name: Security and supply chain

# The dependency-review job below was already written and already carried
# `if: github.event_name == 'pull_request'`, but `pull_request` was never a
# trigger -- so the condition was never true and the job never ran once. A
# guard against a case the workflow cannot reach is indistinguishable from a
# guard that works, which is the worst state for a security control to be in:
# it appears in the file, it appears in the settings, and it checks nothing.
#
# `pull_request` is added here for that job specifically. The two scanners
# below stay on the weekly schedule: both examine the whole tree rather than
# the change, so on a pull request they would report the repository's existing
# findings as though the PR had introduced them, and a check that fails for
# reasons the author cannot fix teaches people to merge past it.
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '43 2 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy filesystem + secrets + misconfiguration
    # Whole-tree scan: see the note on the triggers above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Block HIGH/CRITICAL repository findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 / Trivy 0.70.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  openssf-scorecard:
    name: OpenSSF Scorecard evidence
    # Scores the repository, not the change, and needs id-token on the default
    # branch to publish. Nothing about it is per-pull-request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure repository supply-chain posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4 / Scorecard 5.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Preserve scorecard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-${{ github.sha }}
          path: scorecard-results.sarif
          if-no-files-found: error
          retention-days: 30
