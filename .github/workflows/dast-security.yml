name: Authenticated DAST

on:
  workflow_dispatch:
  schedule:
    - cron: '7 1 * * 5'

permissions:
  contents: read

concurrency:
  group: authenticated-dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: OWASP ZAP full active scan / ephemeral WordPress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: wordpress_dast
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_PATH: /tmp/rpconnector-zap-wp
      WP_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, curl
          tools: wp-cli:2.12.0
          coverage: none

      - name: Build disposable real WordPress target
        run: |
          rm -rf "$WP_PATH"
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress_dast --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url="$WP_URL" --title='Disposable ZAP target' --admin_user=rpadmin --admin_password='DAST-Only-2026!' --admin_email='dast@example.invalid' --skip-email
          cp -a prstudio-unified-control "$WP_PATH/wp-content/plugins/prstudio-unified-control"
          wp plugin activate prstudio-unified-control --path="$WP_PATH"
          wp eval --path="$WP_PATH" 'if (!PRSTUDIO_UC_Store::maybe_upgrade()) { exit(1); }'

      - name: Mint an ephemeral bearer token and serve target to Docker bridge
        run: |
          wp eval --path="$WP_PATH" '
            $m=(new ReflectionClass("PRSTUDIO_UC_MCP_Auth_V5"))->getMethod("issue_tokens");
            $m->setAccessible(true);
            $t=$m->invoke(null,"ci-zap-client","prstudio.read prstudio.write offline_access",PRSTUDIO_UC_MCP_Auth_V5::mcp_url());
            if (!is_array($t) || empty($t["access_token"])) { exit(1); }
            file_put_contents("/tmp/rp-zap-token",$t["access_token"]);
          '
          test -s /tmp/rp-zap-token
          PHP_CLI_SERVER_WORKERS=8 php -S 0.0.0.0:8080 -t "$WP_PATH" "$WP_PATH/index.php" >/tmp/zap-wp.log 2>&1 &
          for i in $(seq 1 100); do
            curl --fail --silent "$WP_URL/?rest_route=/" >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/zap-wp.log
          exit 1

      - name: Export authenticated ZAP header only for the ephemeral target
        run: |
          echo "ZAP_AUTH_HEADER=Authorization" >> "$GITHUB_ENV"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $(cat /tmp/rp-zap-token)" >> "$GITHUB_ENV"
          echo "ZAP_AUTH_HEADER_SITE=172.17.0.1" >> "$GITHUB_ENV"

      - name: Full authenticated active scan — no ignored alert baseline
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: 'http://172.17.0.1:8080/?rest_route=/'
          docker_name: 'zaproxy/zap-stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'authenticated-zap-${{ github.sha }}'
          cmd_options: '-a -m 5'

      - name: Target must remain alive after active attack traffic
        if: always()
        run: |
          curl --fail --silent --show-error "$WP_URL/?rest_route=/" >/tmp/post-zap-rest.json
          wp db check --path="$WP_PATH"
