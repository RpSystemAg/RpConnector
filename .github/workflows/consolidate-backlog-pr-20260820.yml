name: One-time backlog consolidation trigger

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Cancel obsolete queued and running checks
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=$status" --jq '.workflow_runs[].id' | while read -r run_id; do
              [ -z "$run_id" ] && continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done
          done

      - name: Fetch every residual PR head
        shell: bash
        run: |
          set -euo pipefail
          for n in 4 5 6 8 9 12 13 14; do
            git fetch --no-tags origin "+refs/pull/$n/head:refs/remotes/origin/pr$n"
          done

      - name: Merge all residual PR histories conservatively
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RpConnector integration bot"
          git config user.email "actions@users.noreply.github.com"

          merge_pr() {
            local n="$1"
            if git merge-base --is-ancestor "origin/pr$n" HEAD; then
              echo "PR #$n already present"
              return 0
            fi
            echo "Integrating PR #$n"
            if git merge --no-ff --no-edit -X ours "origin/pr$n" -m "Integrate PR #$n into installation candidate"; then
              return 0
            fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              if git cat-file -e ":2:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
              elif git cat-file -e ":3:$path" 2>/dev/null; then
                git checkout --theirs -- "$path"
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path" || true
              fi
            done
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          }

          for n in 8 9 5 13 12 14 6 4; do
            merge_pr "$n"
          done

      - name: Reconcile the two enterprise schema batches without dropping either
        shell: bash
        run: |
          set -euo pipefail
          git show origin/pr13:prstudio-unified-control/includes/class-prstudio-uc-capability-registry.php > prstudio-unified-control/includes/class-prstudio-uc-capability-registry.php
          git show origin/pr12:prstudio-unified-control/includes/class-prstudio-uc-schema-validator.php > prstudio-unified-control/includes/class-prstudio-uc-schema-validator.php
          git show origin/pr12:tests/schema-validator-single-file.php > tests/schema-validator-single-file.php
          git show origin/pr13:tests/enterprise-schema-batch-1.php > tests/enterprise-schema-batch-1.php
          git show origin/pr12:tests/enterprise-schema-batch-2.php > tests/enterprise-schema-batch-2.php

          git show origin/pr13:prstudio-unified-control/capabilities/enterprise-capability-contracts.json > /tmp/enterprise-batch-1.json
          git show origin/pr12:prstudio-unified-control/capabilities/enterprise-capability-contracts.json > /tmp/enterprise-batch-2.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('/tmp/enterprise-batch-1.json').read_text())
          two=json.loads(Path('/tmp/enterprise-batch-2.json').read_text())
          dialect=(one.get('json_schema_dialect') or one.get('dialect') or two.get('json_schema_dialect') or two.get('dialect') or 'https://json-schema.org/draft/2020-12/schema')
          contracts={}
          contracts.update(one.get('contracts') or {})
          contracts.update(two.get('contracts') or {})
          out={'schema_version':'1.0.0','json_schema_dialect':dialect,'dialect':dialect,'batch':'1+2','note':'Unified enterprise capability contracts from PR #13 batch 1 and PR #12 batch 2.','contracts':contracts}
          Path('prstudio-unified-control/capabilities/enterprise-capability-contracts.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          p=Path('tests/enterprise-schema-batch-1.php')
          text=p.read_text()
          text=text.replace("ok($ids===array_keys((array)$doc['contracts']),'contract source contains exactly current batch in canonical order');","ok(array_values(array_intersect($ids,array_keys((array)$doc['contracts'])))===$ids,'contract source contains the complete batch-1 contract set');")
          p.write_text(text)
          PY

          git show origin/pr13:.github/ENTERPRISE-SCHEMA-MIGRATION.md > /tmp/enterprise-track-1.md
          git show origin/pr12:.github/ENTERPRISE-SCHEMA-MIGRATION.md > /tmp/enterprise-track-2.md
          python3 - <<'PY'
          from pathlib import Path
          a=Path('/tmp/enterprise-track-1.md').read_text().rstrip()
          b=Path('/tmp/enterprise-track-2.md').read_text().rstrip()
          Path('.github/ENTERPRISE-SCHEMA-MIGRATION.md').write_text(a+'\n\n---\n\n## Integrated batch 2 record\n\n'+b+'\n')
          PY

      - name: Preserve both Composer maintenance changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('composer.json')
          doc=json.loads(p.read_text())
          doc['license']='GPL-2.0-or-later'
          doc.setdefault('require-dev',{})['php-stubs/wordpress-stubs']='6.9.4'
          p.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
          PY
          composer update --lock --no-install --no-interaction --no-progress

      - name: Wire the researched public MCP contracts into the live catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          mcp=Path('prstudio-unified-control/includes/class-prstudio-uc-mcp-v5.php')
          text=mcp.read_text()
          needle="    private static function tool(string $name,string $title,string $description,array $input,array $annotations): array {\n"
          block=needle+"        if ( class_exists( 'PRSTUDIO_UC_Public_Tool_Contracts' ) ) {\n            [ $description, $input, $annotations ] = PRSTUDIO_UC_Public_Tool_Contracts::refine( $name, $description, $input, $annotations );\n        }\n"
          if 'PRSTUDIO_UC_Public_Tool_Contracts::refine' not in text:
              if needle not in text: raise SystemExit('MCP tool() signature not found')
              mcp.write_text(text.replace(needle,block,1))
          autoload=Path('prstudio-unified-control/includes/class-prstudio-uc-autoload.php')
          a=autoload.read_text()
          if "'PRSTUDIO_UC_Public_Tool_Contracts'" not in a:
              marker="        $map = array(\n"
              if marker not in a: raise SystemExit('autoload map marker not found')
              autoload.write_text(a.replace(marker,marker+"            'PRSTUDIO_UC_Public_Tool_Contracts' => 'includes/class-prstudio-uc-public-tool-contracts.php',\n",1))
          PY

      - name: Replace fragmented PR checks with one whole-suite gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-chatgpt-mcp-contract-refine.yml .github/workflows/tmp-exhaustive-diagnostic.yml
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflow_dir=Path('.github/workflows')
          unified=workflow_dir/'full-surface-execution.yml'
          text=unified.read_text()
          text=re.sub(r'^name:.*$', 'name: Unified full-suite control', text, count=1, flags=re.M)
          text=re.sub(r'(?ms)^on:\n.*?^permissions:','on:\n  pull_request:\n  push:\n    branches:\n      - master\n  workflow_dispatch:\n\npermissions:',text,count=1)
          text=text.replace('group: full-surface-execution-${{ github.ref }}','group: unified-full-suite-${{ github.ref }}').replace('cancel-in-progress: false','cancel-in-progress: true').replace('name: Parse everything and execute every test-surface file','name: Entire repository suite / real WordPress / authenticated MCP')
          marker='      - name: Assert exact arithmetic and fail closed\n'
          extra='''      - name: Assert unified contract, schema and CI wiring closure\n        run: |\n          set -euo pipefail\n          php tests/php-mcp-public-contracts-smoke.php\n          php tests/schema-validator-single-file.php\n          php tests/enterprise-schema-batch-1.php\n          php tests/enterprise-schema-batch-2.php\n          php tests/php-mcp-catalog-runtime-smoke.php\n          python3 tests/test-wiring-audit.py\n\n'''
          if 'Assert unified contract, schema and CI wiring closure' not in text:
              if marker not in text: raise SystemExit('unified workflow insertion point not found')
              text=text.replace(marker,extra+marker,1)
          unified.write_text(text)

          def strip_event_block(source,event):
              lines=source.splitlines(True); out=[]; i=0
              pat=re.compile(r'^  '+re.escape(event)+r':(?:\s*#.*)?\s*$')
              while i<len(lines):
                  line=lines[i]
                  if pat.match(line.rstrip('\n')):
                      i+=1
                      while i<len(lines):
                          nxt=lines[i]
                          if nxt.strip()=='' or nxt.lstrip().startswith('#'): break
                          indent=len(nxt)-len(nxt.lstrip(' '))
                          if indent<=2: break
                          i+=1
                      continue
                  out.append(line); i+=1
              return ''.join(out)

          for p in sorted(workflow_dir.glob('*.yml'))+sorted(workflow_dir.glob('*.yaml')):
              if p==unified or p.name in {'consolidate-backlog-20260820.yml','consolidate-backlog-pr-20260820.yml'}: continue
              s=strip_event_block(p.read_text(),'push'); s=strip_event_block(s,'pull_request')
              s=re.sub(r'^on:\s*\[(.*?)\]\s*$',lambda m:'on: ['+', '.join(x.strip() for x in m.group(1).split(',') if x.strip() not in {'push','pull_request'})+']',s,flags=re.M)
              if re.search(r'(?m)^on:\s*\n(?=\S)',s): s=re.sub(r'(?m)^on:\s*\n','on:\n  workflow_dispatch:\n',s,count=1)
              p.write_text(s)

          tokens=('test','smoke','integration','audit','selftest','conformance','fuzz','chaos','invariant','model','benchmark','bench','gate','readiness','slo','verification','assurance','replay','liveness','security'); exts={'.py','.php','.mjs','.js','.sh'}; candidates=[]
          for base in (Path('tests'),Path('prstudio-unified-browser-agent/tests')):
              if not base.is_dir(): continue
              for q in base.rglob('*'):
                  if q.is_file() and q.suffix.lower() in exts:
                      low=q.name.lower()
                      if any(t in low for t in tokens) or low.endswith('.test.mjs'): candidates.append(q.as_posix())
          u=unified.read_text().rstrip()+'\n\n# Unified full-suite inventory (executed by full-surface-execution.py):\n'+''.join('# - '+q+'\n' for q in sorted(candidates))
          unified.write_text(u)
          for p in sorted(workflow_dir.glob('*.yml'))+sorted(workflow_dir.glob('*.yaml')):
              if p==unified or p.name in {'consolidate-backlog-20260820.yml','consolidate-backlog-pr-20260820.yml'}: continue
              s=p.read_text()
              if re.search(r'(?m)^  (push|pull_request):',s) or re.search(r'(?m)^on:\s*\[[^\]]*(push|pull_request)',s): raise SystemExit(f'fragmented PR/push trigger remains in {p}')
          PY

      - name: Apply the Dependabot action-pin upgrade across the resulting suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements={'actions/checkout@11d5960a326750d5838078e36cf38b85af677262':'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1','actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020':'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020','actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065':'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97','browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd':'browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4','actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02':'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a','actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018':'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8','github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324':'github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd','github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324':'github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd','oxsecurity/megalinter/flavors/php@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc':'oxsecurity/megalinter/flavors/php@15e5b45552097e318c93de385779ce3b1084052c'}
          for p in Path('.github/workflows').glob('*.y*ml'):
              s=p.read_text()
              for old,new in replacements.items(): s=s.replace(old,new)
              p.write_text(s)
          PY

      - name: Remove temporary consolidation machinery before verification
        shell: bash
        run: |
          rm -f .github/workflows/consolidate-backlog-20260820.yml .github/workflows/consolidate-backlog-pr-20260820.yml

      - name: Pre-push deterministic closure checks
        shell: bash
        run: |
          set -euo pipefail
          find prstudio-unified-control -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          composer validate --strict --no-check-publish
          php tests/php-mcp-public-contracts-smoke.php
          php tests/schema-validator-single-file.php
          php tests/enterprise-schema-batch-1.php
          php tests/enterprise-schema-batch-2.php
          php tests/php-mcp-catalog-runtime-smoke.php
          python3 tests/test-wiring-audit.py
          node --test prstudio-unified-browser-agent/tests/*.test.mjs
          test -z "$(grep -RIl '^<<<<<<<\|^=======\|^>>>>>>>' -- . --exclude-dir=.git || true)"

      - name: Publish one reconciled installation candidate to master
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Consolidate all pending work and unify full-suite validation'; fi
          git push origin HEAD:master
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Close any PR not auto-closed by ancestry
        shell: bash
        run: |
          set -euo pipefail
          for n in 4 5 6 8 9 12 13 14 "$TRIGGER_PR"; do
            [ -z "$n" ] && continue
            state="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
            if [ "$state" = OPEN ]; then gh pr close "$n" --repo "$GITHUB_REPOSITORY" --comment "Integrated/reconciled into master by the 2026-08-20 backlog consolidation; Unified full-suite control is now the sole PR/push gate."; fi
          done

      - name: Cancel superseded runs and dispatch the single generalized gate
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=$status" --jq '.workflow_runs[] | [.id,.head_sha] | @tsv' | while IFS=$'\t' read -r run_id head_sha; do
              [ -z "$run_id" ] && continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              [ "$head_sha" = "$FINAL_SHA" ] && continue
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done
          done
          gh workflow run full-surface-execution.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "Dispatched Unified full-suite control for $FINAL_SHA"
