# Dependabot configuration.
#
# The only third-party code this repository pulls in is the GitHub Actions used
# by its workflows. There is no package.json and no requirements.txt: the plugin
# is dependency-free PHP, the Browser Agent is dependency-free JavaScript, and
# the one Python package the pipeline needs (sqlglot) is installed ad hoc in the
# job that uses it.
#
# That makes the actions ecosystem the whole supply chain, and worth watching.
# A workflow action runs with access to the repository and its secrets, so an
# unmaintained or compromised one is the most direct path into this repo --
# more direct than anything in the application code, which cannot reach CI.
#
# Grouped into a single weekly pull request. Separate PRs per action would
# produce a stream of near-identical reviews for a set that changes together
# anyway, and a review nobody reads is not a review.
#
# A `docker` ecosystem entry was proposed on the branch this merged with. It is
# left out because `git ls-files` finds no Dockerfile and no compose file:
# Dependabot would have nothing to read, and a configured ecosystem that never
# produces an update is indistinguishable from one that is quietly broken. Add
# it in the same commit that adds the first Dockerfile.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Composer. The note above is right that the shipped plugin is dependency-free
  # PHP -- and composer.json/composer.lock exist anyway, pinning phpstan,
  # wordpress-stubs and phpstan-wordpress to exact versions for the static
  # analysis toolchain.
  #
  # Those pins are the reason to watch this, not an exception to it. They are
  # dev dependencies, so nothing here reaches a customer's site; but they are
  # installed and executed inside CI, which is the environment that holds the
  # repository token. That is the same argument the actions entry above makes,
  # and it applies with equal force to anything else CI runs.
  #
  # Exact pins also do not update themselves. Left alone they go stale silently:
  # the lockfile keeps resolving, the job keeps passing, and the version drifts
  # further from the one the advisories are written about.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    groups:
      php-quality-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
