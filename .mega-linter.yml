# MegaLinter configuration for the PR STUDIO Unified Suite.
#
# Posture: advisory, deliberately. This repo predates the linter, so a first full
# run surfaces a long tail of pre-existing style findings. Blocking on those
# would train everyone to skip the job, which is exactly how a real finding gets
# missed. Read the report, fix in batches, and move individual linters to
# blocking as their backlog clears.
#
# What is NOT advisory lives elsewhere and blocks: the PHP 8.0 compatibility
# check in this same workflow, the one-guard constitution, the tools/list token
# budget, the SQL syntax validator and the task-queue integration test.

APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false

# Fail the step only on genuine errors, never on style. See posture above.
DISABLE_ERRORS: true

ENABLE_LINTERS:
  # PHP: the plugin is the part that can break a live site.
  - PHP_PHPCS
  - PHP_PHPSTAN
  # JavaScript: the Browser Agent extension.
  - JAVASCRIPT_ES
  # The generated contract artifacts and workflows.
  - JSON_JSONLINT
  - YAML_YAMLLINT
  # Python: the release and validation tooling under tests/.
  - PYTHON_RUFF
  # Documentation.
  - MARKDOWN_MARKDOWNLINT
  # Credentials must never reach the repository.
  - REPOSITORY_SECRETLINT

# Secret detection is the one repository-level check worth blocking on: a
# committed credential cannot be un-published by a later fix.
REPOSITORY_SECRETLINT_DISABLE_ERRORS: false

EXCLUDED_DIRECTORIES:
  - node_modules
  - vendor
  - .git
  - megalinter-reports
  - __pycache__

FILTER_REGEX_EXCLUDE: |
  (\.min\.js$|/dist/|/build/|
   capability-registry\.json|
   capability-search-index\.json|
   action-catalog\.json|
   action-hot-index\.(json|php)|
   capability-contract\.json|
   FILE-INTEGRITY\.json|
   MANIFEST\.json|
   COMPONENT-MANIFEST\.json)

# The excluded JSON above is generated by tests/regenerate-contract-artifacts.py
# and tests/build-release.py. Linting it reports on machine output nobody edits
# by hand, and the drift checks already assert it matches its source.

PHP_PHPCS_ARGUMENTS:
  - "--standard=PSR12"
  - "--extensions=php"

# PHPStan at a low level to start: it finds undefined methods, wrong argument
# counts and impossible conditions -- the classes of defect that reach runtime --
# without demanding full type coverage on a codebase that has none yet.
PHP_PHPSTAN_ARGUMENTS:
  - "--level=1"
  - "--no-progress"

MARKDOWN_MARKDOWNLINT_DISABLE_ERRORS: true
