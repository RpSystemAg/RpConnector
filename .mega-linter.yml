# MegaLinter configuration for the PR STUDIO Unified Suite.
#
# Posture: fail closed. Every enabled linter is a real control. There are no
# advisory-only validators in this file. If a validator is too noisy, its model
# must be corrected (for example with real WordPress stubs) rather than marking
# its failures non-blocking.


APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false
DISABLE_ERRORS: false

ENABLE_LINTERS:
  - PHP_PHPCS
  - PHP_PHPSTAN
  - JAVASCRIPT_ES
  - JSON_JSONLINT
  - YAML_YAMLLINT
  - PYTHON_RUFF
  - MARKDOWN_MARKDOWNLINT
  - REPOSITORY_SECRETLINT

REPOSITORY_SECRETLINT_DISABLE_ERRORS: false
MARKDOWN_MARKDOWNLINT_DISABLE_ERRORS: false

EXCLUDED_DIRECTORIES:
  - node_modules
  - vendor
  - .git
  - megalinter-reports
  - __pycache__

FILTER_REGEX_EXCLUDE: |
  (\.min\.js$|/dist/|/build/|
   capability-registry\.json|
   capability-search-index\.json|
   action-catalog\.json|
   action-hot-index\.(json|php)|
   capability-contract\.json|
   FILE-INTEGRITY\.json|
   MANIFEST\.json|
   COMPONENT-MANIFEST\.json)

# Generated release/catalog artefacts are validated by deterministic rebuild and
# drift gates; style-linting those machine outputs would duplicate the wrong
# concern.

PHP_PHPCS_ARGUMENTS:
  - "--standard=PSR12"
  - "--extensions=php"
  - "-d"
  - "memory_limit=1G"

# WordPress signatures and dynamic types are supplied by the immutable Composer
# toolchain installed before MegaLinter. phpstan.neon contains the production
# scope and intentionally has no baseline.
PHP_PHPSTAN_ARGUMENTS:
  - "--no-progress"
  - "--memory-limit=1G"
PHP_PHPSTAN_CONFIG_FILE: "phpstan.neon"
