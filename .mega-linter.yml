# MegaLinter configuration for the PR STUDIO Unified Suite.
#
# Posture: a ratchet, not a suppression.
#
# This repo predates the linter, so a full sweep surfaces a long tail of
# findings nobody in the current change introduced. Blocking on those stalls
# every commit on pre-existing debt, and a gate that fails for things you did
# not do is one people learn to route around -- which is how a real finding
# ends up ignored.
#
# So the two runs behave differently, set per run in the workflow:
#   - changed files (pull requests, non-master pushes): DISABLE_ERRORS=false.
#     New code must be clean. This is a real gate and it fails the build.
#   - full codebase (master push): DISABLE_ERRORS=true. Reports the standing
#     backlog without blocking, so it stays visible and measurable.
#
# The effect is that the backlog can only shrink: nothing new gets in, and
# existing debt is paid down deliberately rather than under duress.
#
# Checks that block unconditionally, regardless of this file: the PHP
# 8.0/8.1/8.3 matrix, the one-guard constitution, the tools/list token budget,
# the SQL syntax validator and the task-queue integration test.

# PHPStan needs WordPress to say anything useful about a WordPress plugin.
# Without it, every call into core reads as undefined -- 574 of the first
# sweep's 812 findings were exactly that. Installed at run time rather than
# vendored, because committing the stubs would put a megabyte of generated
# code in a repository that otherwise has no dependencies at all.
PRE_COMMANDS:
  - command: composer install --no-interaction --no-progress --quiet
    cwd: workspace
    continue_if_failed: false

APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false

# Default only -- the workflow overrides this per run. See the posture note.
DISABLE_ERRORS: true

ENABLE_LINTERS:
  # PHP: the plugin is the part that can break a live site.
  - PHP_PHPCS
  - PHP_PHPSTAN
  # JavaScript: the Browser Agent extension.
  - JAVASCRIPT_ES
  # The generated contract artifacts and workflows.
  - JSON_JSONLINT
  - YAML_YAMLLINT
  # Python: the release and validation tooling under tests/.
  - PYTHON_RUFF
  # Documentation.
  - MARKDOWN_MARKDOWNLINT
  # Credentials must never reach the repository.
  - REPOSITORY_SECRETLINT

# Secret detection is the one repository-level check worth blocking on: a
# committed credential cannot be un-published by a later fix.
REPOSITORY_SECRETLINT_DISABLE_ERRORS: false

EXCLUDED_DIRECTORIES:
  - node_modules
  - vendor
  - .git
  - megalinter-reports
  - __pycache__

FILTER_REGEX_EXCLUDE: |
  (\.min\.js$|/dist/|/build/|
   capability-registry\.json|
   capability-search-index\.json|
   action-catalog\.json|
   action-hot-index\.(json|php)|
   capability-contract\.json|
   FILE-INTEGRITY\.json|
   MANIFEST\.json|
   COMPONENT-MANIFEST\.json)

# The excluded JSON above is generated by tests/regenerate-contract-artifacts.py
# and tests/build-release.py. Linting it reports on machine output nobody edits
# by hand, and the drift checks already assert it matches its source.

# The memory limit is not decoration. On the full-codebase sweep phpcs died
# with "Allowed memory size of 134217728 bytes exhausted" inside its tokenizer,
# and MegaLinter reported that crash as "1 non blocking error" -- which reads
# exactly like a single style finding. The full sweep had produced no PHP style
# signal at all for as long as it has existed, while appearing to have run.
PHP_PHPCS_ARGUMENTS:
  - "--standard=PSR12"
  - "--extensions=php"
  - "-d"
  - "memory_limit=1G"

# PHPStan at a low level to start: it finds undefined methods, wrong argument
# counts and impossible conditions -- the classes of defect that reach runtime --
# without demanding full type coverage on a codebase that has none yet.
# Configuration lives in phpstan.neon so the analysis has the same shape here
# and on a developer machine. Read that file for why the first full sweep's 812
# findings were all artefacts.
PHP_PHPSTAN_ARGUMENTS:
  - "--no-progress"
PHP_PHPSTAN_CONFIG_FILE: "phpstan.neon"

MARKDOWN_MARKDOWNLINT_DISABLE_ERRORS: true
